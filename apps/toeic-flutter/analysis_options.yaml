# Giống app mẫu Tập 2 của sách: flutter_lints (mặc định của `flutter create`) + luật chặt hơn.
# Thêm strict-inference so với sách.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - private-data/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    unawaited_futures: true
    prefer_final_locals: true
    use_super_parameters: true
    sort_child_properties_last: true

# `dart format` dùng bề rộng dòng 120 (mặc định 80) cho dễ đọc trong sách.
formatter:
  page_width: 120
