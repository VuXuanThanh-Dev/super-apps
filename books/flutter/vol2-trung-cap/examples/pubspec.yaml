name: tap2_so_tu_vung
description: "App mẫu Tập 2 sách Flutter: Sổ Từ Vựng (+ ví dụ từng chương)"
publish_to: 'none'
version: 1.0.0+1

# Flutter 3.47.5 / Dart 3.13.4 — xem books/flutter/STACK.md (mục 5: bảng package cho Task 9)
environment:
  sdk: ^3.13.4

# Ghim chính xác (exact), không dùng ^.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  go_router: 18.0.2
  provider: 6.1.5+1
  sqflite: 2.4.4
  sqflite_common_ffi_web: 1.2.0
  # Ghim để khớp với web/sqlite3.wasm do `dart run sqflite_common_ffi_web:setup` tải về (bản sqlite3-3.6.0).
  sqlite3: 3.6.0
  path: 1.9.1
  shared_preferences: 2.5.5
  http: 1.6.0
  flutter_tts: 4.2.5
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_timezone: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.3
  mocktail: 1.0.5

flutter:
  uses-material-design: true
