# Workflow MẪU build iOS và đẩy lên TestFlight (Tập 3 Chương 5–6). NOT RUN: cần tài khoản Apple Developer Program
# và các secret bên dưới. Runner macOS có Xcode sẵn; Flutter cài bằng subosito/flutter-action.
name: ios-testflight

on:
  workflow_dispatch:   # chỉ chạy khi bấm tay trên GitHub

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: books/flutter/vol3-nang-cao/examples
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      # Build số tự tăng theo lần chạy workflow; ExportOptions.plist + chứng chỉ ký nằm trong secrets.
      - name: Build IPA
        run: >
          flutter build ipa --release
          --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
          --export-options-plist=ios/ExportOptions.plist
      # Lệnh upload theo docs "Build and release an iOS app" (xcrun altool + App Store Connect API key).
      # altool tìm file khóa AuthKey_<KEY_ID>.p8 trong ~/private_keys — UNVERIFIED (theo tài liệu altool, chưa chạy).
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
