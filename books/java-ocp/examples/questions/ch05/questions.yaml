questions:
  - id: "05-01"
    level: easy
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Remove {
          public static void main(String[] args) {
              List<Integer> list = new ArrayList<>(List.of(5, 1, 3, 1));
              list.remove(1);
              list.remove(Integer.valueOf(1));
              System.out.println(list);
          }
      }
    expect: "[5, 3]"
    options: {A: "[5, 3]", B: "[5, 3, 1]", C: "[3, 1]", D: "[5, 1]"}
    answer: A
    why: >-
      `remove(1)` với tham số `int` gọi `remove(int index)` → xoá phần tử ở chỉ số 1 (giá trị 1) → `[5, 3, 1]`.
      `remove(Integer.valueOf(1))` gọi `remove(Object)` → xoá lần xuất hiện đầu tiên của giá trị 1 → `[5, 3]`.
    wrong:
      B: "Lời gọi thứ hai xoá giá trị 1 còn lại."
      C: "`remove(1)` xoá theo chỉ số, không xoá phần tử đầu tiên."
      D: "`remove(1)` xoá phần tử ở chỉ số 1 chứ không phải giá trị 3."

  - id: "05-02"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Nav {
          public static void main(String[] args) {
              TreeSet<Integer> t = new TreeSet<>(List.of(8, 2, 6, 4));
              System.out.println(t.floor(5) + " " + t.higher(6) + " " + t.headSet(6) + " "
                      + t.pollFirst() + " " + t);
          }
      }
    expect: "4 8 [2, 4] 2 [4, 6, 8]"
    options:
      A: "4 8 [2, 4, 6] 2 [4, 6, 8]"
      B: "6 8 [2, 4] 2 [2, 4, 6, 8]"
      C: "4 6 [2, 4] 2 [4, 6, 8]"
      D: "4 8 [2, 4] 2 [4, 6, 8]"
    answer: D
    why: >-
      `floor(5)` = phần tử lớn nhất ≤ 5 → 4. `higher(6)` = nhỏ nhất > 6 → 8. `headSet(6)` = các phần tử **nhỏ hơn**
      6 (không gồm 6) → [2, 4]. `pollFirst()` lấy **và xoá** 2, nên set còn [4, 6, 8]. Biểu thức tính từ trái sang
      phải nên `headSet` được in trước khi `pollFirst` chạy.
    wrong:
      A: "`headSet(6)` mặc định không gồm 6."
      B: "`floor(5)` phải ≤ 5; và `pollFirst()` đã xoá 2 khỏi set."
      C: "`higher(6)` là phần tử lớn hơn hẳn 6, tức 8."

  - id: "05-03"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Puts {
          public static void main(String[] args) {
              Map<String, Integer> m = new HashMap<>();
              m.put("a", 1);
              Integer r1 = m.put("a", 2);
              Integer r2 = m.putIfAbsent("a", 3);
              Integer r3 = m.putIfAbsent("b", 4);
              m.merge("a", 10, (x, y) -> x + y);
              System.out.println(r1 + " " + r2 + " " + r3 + " " + m.get("a") + " " + m.get("b"));
          }
      }
    expect: "1 2 null 12 4"
    options:
      A: "1 null null 12 4"
      B: "null 2 null 13 4"
      C: "1 2 null 12 4"
      D: "1 2 4 12 4"
    answer: C
    why: >-
      `put` trả về giá trị **cũ** (1). `putIfAbsent` khi key đã có: không đổi và trả về giá trị hiện tại (2). Khi key
      chưa có: thêm và trả về `null`. `merge("a", 10, sum)` → 2 + 10 = 12.
    wrong:
      A: "`putIfAbsent` trả về giá trị đang có (2) khi key đã tồn tại."
      B: "`put` lần hai trả về giá trị cũ 1; `putIfAbsent(\"a\", 3)` không ghi đè nên merge tính 2 + 10."
      D: "`putIfAbsent` trả về `null` khi vừa thêm key mới."

  - id: "05-04"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Dq {
          public static void main(String[] args) {
              Deque<Integer> d = new ArrayDeque<>();
              d.push(1);
              d.offer(2);
              d.push(3);
              d.offerFirst(4);
              System.out.println(d.pop() + " " + d.pollLast() + " " + d.peek() + " " + d);
          }
      }
    expect: "4 2 3 [3, 1]"
    options:
      A: "1 4 2 [2, 3]"
      B: "4 2 1 [3, 1]"
      C: "2 4 3 [3, 1]"
      D: "4 2 3 [3, 1]"
    answer: D
    why: >-
      `push` = `addFirst`, `offer` = `addLast`. Sau 4 lệnh: [4, 3, 1, 2]. `pop()` lấy đầu → 4. `pollLast()` lấy cuối
      → 2. `peek()` xem đầu (không xoá) → 3. Còn lại [3, 1].
    wrong:
      A: "`push` thêm vào **đầu** deque, không phải cuối."
      B: "Sau khi `pop()` lấy 4, phần tử đầu là 3."
      C: "`pop()` lấy từ đầu (4), `pollLast()` lấy từ cuối (2)."

  - id: "05-05"
    level: hard
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Search {
          public static void main(String[] args) {
              String[] arr = {"kiwi", "Fig", "apple", "Date"};
              Arrays.sort(arr);
              System.out.println(Arrays.toString(arr) + " " + Arrays.binarySearch(arr, "banana"));
          }
      }
    expect: "[Date, Fig, apple, kiwi] -4"
    options:
      A: "[apple, Date, Fig, kiwi] -2"
      B: "[Date, Fig, apple, kiwi] -4"
      C: "[Date, Fig, apple, kiwi] -3"
      D: "[apple, Date, Fig, kiwi] -3"
    answer: B
    why: >-
      Thứ tự tự nhiên của `String` theo mã Unicode: chữ HOA (`D`, `F`) đứng trước chữ thường. `"banana"` sẽ chèn vào
      giữa `apple` (chỉ số 2) và `kiwi` (chỉ số 3), nên vị trí chèn là 3; không tìm thấy → `-(3) - 1 = -4`.
    wrong:
      A: "Sắp xếp `String` phân biệt hoa thường: chữ hoa trước."
      C: "Công thức khi không thấy là `-(insertion point) - 1`, tức -4 chứ không phải -3."
      D: "Sai cả thứ tự sắp xếp lẫn giá trị trả về."

  - id: "05-06"
    level: medium
    topic: "5.1"
    q: Chèn dòng nào vào chỗ `// INSERT CODE HERE` thì chương trình biên dịch được?
    kind: variants
    criterion: compiles
    template: |
      import java.util.*;

      public class Wildcards {
          public static void main(String[] args) {
              /*INSERT*/
          }
      }
    options:
      A: "List<Number> a = new ArrayList<Integer>();"
      B: "List<? extends Number> b = new ArrayList<Integer>();"
      C: "List<? super Integer> c = new ArrayList<Number>();"
      D: "List<Object> d = new ArrayList<String>();"
      E: "ArrayList<> e = new ArrayList<String>();"
      F: "var f = new ArrayList<>();"
    answer: [B, C, F]
    why: >-
      Generics bất biến (invariant): `List<Number>` không nhận `ArrayList<Integer>`. Wildcard nới lỏng: `? extends Number`
      nhận list của bất kỳ lớp con nào của `Number` (B); `? super Integer` nhận list của `Integer` hoặc lớp cha (C).
      `var` với diamond suy ra `ArrayList<Object>` (F).
    wrong:
      A: "`ArrayList<Integer>` không phải `List<Number>` dù `Integer` là `Number`."
      D: "`ArrayList<String>` không phải `List<Object>`."
      E: "Diamond `<>` chỉ dùng ở vế phải (sau `new`)."

  - id: "05-07"
    level: hard
    topic: "5.1"
    q: Kết quả của chương trình là gì?
    kind: output
    code: |
      import java.util.*;

      public class Cme {
          public static void main(String[] args) {
              List<String> list = new ArrayList<>(List.of("a", "b", "c"));
              for (String s : list) {
                  if (s.equals("b")) list.remove(s);
              }
              System.out.println(list);
          }
      }
    expect: "[a, c]"
    opt_style: text
    options:
      A: "In ra `[a, c]`"
      B: "Ném `ConcurrentModificationException`"
      C: "In ra `[a, b, c]`"
      D: "Không biên dịch được"
    answer: A
    why: >-
      Bẫy khó: xoá phần tử **áp chót** (`b`) thì không có exception. Sau khi xoá, list còn 2 phần tử và vị trí con trỏ
      của iterator là 2, nên `hasNext()` trả về `false` và vòng lặp kết thúc trước khi `next()` kịp kiểm tra thay đổi.
      Đây là hành vi của cài đặt `ArrayList` — **đừng dựa vào nó** trong code thật; hãy dùng `removeIf` hoặc `Iterator.remove`.
    wrong:
      B: "`ConcurrentModificationException` chỉ ném khi `next()` được gọi sau khi list bị sửa; ở đây vòng lặp đã dừng."
      C: "`list.remove(s)` có chạy và xoá `b`."
      D: "Sửa list trong for-each là lỗi lúc chạy (nếu có), không phải lỗi biên dịch."

  - id: "05-08"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Sorter {
          record P(String name, int age) { }

          public static void main(String[] args) {
              List<P> ps = new ArrayList<>(List.of(new P("Lan", 30), new P("An", 25),
                      new P("Minh", 30), new P("Bao", 25)));
              ps.sort(Comparator.comparing(P::age).reversed().thenComparing(P::name));
              System.out.println(ps.stream().map(P::name).toList());
          }
      }
    expect: "[Lan, Minh, An, Bao]"
    options:
      A: "[Minh, Lan, Bao, An]"
      B: "[An, Bao, Lan, Minh]"
      C: "[Lan, Minh, An, Bao]"
      D: "[Lan, Minh, Bao, An]"
    answer: C
    why: >-
      `comparing(P::age).reversed()` → tuổi giảm dần (30 trước 25). `thenComparing(P::name)` áp dụng **sau** `reversed()`
      nên tên vẫn tăng dần: Lan, Minh (30), rồi An, Bao (25).
    wrong:
      A: "`reversed()` chỉ đảo phần so sánh theo tuổi đứng trước nó; tên vẫn tăng dần."
      B: "`reversed()` làm tuổi giảm dần, nên nhóm 30 đứng trước."
      D: "Trong nhóm 25, tên tăng dần: An trước Bao."

  - id: "05-09"
    level: easy
    topic: "5.1"
    q: Kết quả của chương trình là gì?
    kind: output
    code: |
      public class Jagged {
          public static void main(String[] args) {
              int[][] a = new int[3][];
              a[0] = new int[2];
              System.out.println(a.length + " " + a[0].length + " " + a[0][1] + " " + a[1]);
          }
      }
    expect: "3 2 0 null"
    opt_style: text
    options:
      A: "In ra `3 0 0 null`"
      B: "In ra `3 2 null null`"
      C: "Ném `NullPointerException`"
      D: "In ra `3 2 0 null`"
    answer: D
    why: >-
      `new int[3][]` tạo mảng ngoài 3 phần tử, mỗi phần tử (mảng con) mặc định `null`. `a[0]` được gán mảng 2 phần tử
      `int` (mặc định 0). In `a[1]` (là `null`) không gây NPE vì chỉ nối chuỗi, không truy cập phần tử.
    wrong:
      A: "`a[0]` là mảng 2 phần tử nên `a[0].length` là 2."
      B: "Phần tử của `int[]` mặc định là 0, không phải `null`."
      C: "Nối `null` vào chuỗi in ra chữ `null`; không có truy cập `a[1][...]`."

  - id: "05-10"
    level: medium
    topic: "5.1"
    q: Hai phát biểu nào đúng?
    kind: proofs
    options:
      A: "`HashMap` cho phép một key `null`."
      B: "`TreeMap` (thứ tự tự nhiên) cho phép key `null`."
      C: "`ArrayDeque` cho phép phần tử `null`."
      D: "`List.of(...)` trả về list không thay đổi được."
      E: "`LinkedHashSet` sắp xếp phần tử theo thứ tự tự nhiên."
    proofs:
      A:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new HashMap<>(); m.put(null, 1); System.out.println(m.get(null)); } }
        expect: "1"
      B:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new TreeMap<>(); m.put(null, 1); } }
        expect_exception: NullPointerException
      C:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              new ArrayDeque<String>().add(null); } }
        expect_exception: NullPointerException
      D:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              List.of(1).add(2); } }
        expect_exception: UnsupportedOperationException
      E:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              System.out.println(new LinkedHashSet<>(List.of("b", "a"))); } }
        expect: "[b, a]"
    answer: [A, D]
    why: >-
      A: `HashMap` cho phép một key `null` (và nhiều value `null`). D: `List.of` trả về list bất biến; `add` ném
      `UnsupportedOperationException`.
    wrong:
      B: "`TreeMap` phải so sánh key; so sánh `null` theo thứ tự tự nhiên ném `NullPointerException`."
      C: "`ArrayDeque` dùng `null` làm tín hiệu \"rỗng\", nên cấm phần tử `null`."
      E: "`LinkedHashSet` giữ **thứ tự thêm vào**; sắp xếp là việc của `TreeSet`."

  - id: "05-11"
    level: hard
    topic: "5.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.*;

      public class Wild {
          static void read(List<? extends Number> in) {
              Number n = in.get(0);            // L1
              in.add(null);                    // L2
              in.add(Integer.valueOf(1));      // L3
          }

          static void write(List<? super Integer> out) {
              out.add(5);                      // L4
              Integer i = out.get(0);          // L5
          }

          public static void main(String[] args) { }
      }
    error_markers: [L3, L5]
    options: {A: L2 và L3, B: L3 và L5, C: Chỉ L3, D: "L2, L3 và L5", E: L4 và L5}
    answer: B
    why: >-
      `? extends Number`: đọc ra được `Number` (L1) nhưng **không thêm** được gì ngoài `null` (L2 hợp lệ, L3 lỗi),
      vì list thật có thể là `List<Double>`. `? super Integer`: thêm `Integer` được (L4), nhưng đọc ra chỉ biết là
      `Object` (L5 lỗi).
    wrong:
      A: "Thêm `null` luôn hợp lệ vì `null` thuộc mọi kiểu tham chiếu."
      C: "L5 cũng lỗi: `out.get(0)` có kiểu `Object`."
      D: "L2 hợp lệ (xem A)."
      E: "`? super Integer` cho phép thêm `Integer` → L4 hợp lệ."

  - id: "05-12"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Seq {
          public static void main(String[] args) {
              List<String> list = new ArrayList<>(List.of("b", "c"));
              list.addFirst("a");
              List<String> rev = list.reversed();
              list.addLast("d");
              System.out.println(rev + " " + rev.getFirst() + " " + list.getLast());
          }
      }
    expect: "[d, c, b, a] d d"
    options:
      A: "[c, b, a] c d"
      B: "[d, c, b, a] a d"
      C: "[d, c, b, a] d d"
      D: "[a, b, c, d] a d"
    answer: C
    why: >-
      Java 21 thêm `SequencedCollection`: `addFirst`, `addLast`, `getFirst`, `getLast`, `reversed`. `reversed()` trả về
      một **view** đảo ngược, nên thay đổi sau đó (`addLast("d")`) vẫn thấy được. `rev` là [d, c, b, a].
    wrong:
      A: "`reversed()` là view, không phải bản sao; nó thấy cả `d` được thêm sau."
      B: "Phần tử đầu của view đảo ngược là phần tử cuối của list: `d`."
      D: "`rev` là thứ tự đảo ngược của list."

  - id: "05-13"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Rev {
          public static void main(String[] args) {
              TreeMap<String, Integer> m = new TreeMap<>(Comparator.reverseOrder());
              m.put("b", 2);
              m.put("a", 1);
              m.put("c", 3);
              System.out.println(m + " " + m.firstKey() + " " + m.headMap("b"));
          }
      }
    expect: "{c=3, b=2, a=1} c {c=3}"
    options:
      A: "{a=1, b=2, c=3} a {a=1}"
      B: "{c=3, b=2, a=1} c {a=1}"
      C: "{c=3, b=2, a=1} a {c=3}"
      D: "{c=3, b=2, a=1} c {c=3}"
    answer: D
    why: >-
      `TreeMap` sắp xếp theo comparator được truyền vào: ngược thứ tự tự nhiên → c, b, a. `firstKey()` là key đầu theo
      thứ tự đó (`c`). `headMap("b")` = các key đứng **trước** `b` theo thứ tự của map → chỉ `c`.
    wrong:
      A: "Comparator `reverseOrder()` đảo thứ tự: c đứng đầu."
      B: "`headMap` dùng thứ tự của map (c, b, a), nên phần đứng trước `b` là `c`."
      C: "`firstKey()` là `c` theo thứ tự của map."

  - id: "05-14"
    level: easy
    topic: "5.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Decl {
          public static void main(String[] args) {
              int[] a = new int[3];            // L1
              int[] b = new int[3]{1, 2, 3};   // L2
              int c[] = {1, 2, 3};             // L3
              int[] d = new int[];             // L4
              int[][] e = new int[2][];        // L5
          }
      }
    error_markers: [L2, L4]
    options: {A: Chỉ L2, B: L2 và L4, C: L4 và L5, D: "L2, L4 và L5", E: L3 và L4}
    answer: B
    why: >-
      Khi có danh sách giá trị `{...}` thì **không** được ghi kích thước (L2 lỗi). Khi không có danh sách giá trị thì
      **phải** ghi kích thước (L4 lỗi). L3 dùng cú pháp kiểu C (`int c[]`) vẫn hợp lệ. L5 chỉ cần kích thước chiều đầu.
    wrong:
      A: "L4 cũng lỗi: `new int[]` thiếu kích thước."
      C: "L5 hợp lệ: mảng nhiều chiều chỉ bắt buộc kích thước chiều đầu tiên."
      D: "L5 hợp lệ (xem C)."
      E: "`int c[] = {...}` là cú pháp hợp lệ."

  - id: "05-15"
    level: hard
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Custom {
          public static void main(String[] args) {
              TreeSet<String> set = new TreeSet<>(
                      Comparator.comparing(String::length).thenComparing(Comparator.reverseOrder()));
              set.addAll(List.of("bb", "a", "ccc", "aa", "b"));
              System.out.println(set);
          }
      }
    expect: "[b, a, bb, aa, ccc]"
    options:
      A: "[b, a, bb, aa, ccc]"
      B: "[a, b, aa, bb, ccc]"
      C: "[ccc, bb, aa, b, a]"
      D: "[a, aa, b, bb, ccc]"
    answer: A
    why: >-
      So sánh theo độ dài trước (1, 2, 3), cùng độ dài thì theo thứ tự chữ **ngược** (`b` trước `a`, `bb` trước `aa`).
    wrong:
      B: "Tiêu chí thứ hai là `reverseOrder()`, nên cùng độ dài thì `b` đứng trước `a`."
      C: "Độ dài được so sánh tăng dần (không có `reversed()` cho độ dài)."
      D: "Tiêu chí đầu tiên là độ dài, không phải chữ cái."

  - id: "05-16"
    level: medium
    topic: "5.1"
    q: Hai phát biểu nào đúng về lớp `Arrays`?
    kind: proofs
    options:
      A: "`Arrays.asList` trả về list cố định kích thước nhưng vẫn gọi `set()` được."
      B: "`Arrays.equals(a, b)` so sánh tham chiếu của hai mảng."
      C: "`Arrays.binarySearch` trên mảng chưa sắp xếp luôn trả về -1."
      D: "`Arrays.compare` trả về số âm nếu mảng thứ nhất nhỏ hơn theo thứ tự từ điển."
      E: "Sau `int[] a = {};` thì `a.length` bằng 1."
    proofs:
      A:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              List<String> l = Arrays.asList("x", "y"); l.set(0, "z"); System.out.println(l); } }
        expect: "[z, y]"
      B:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              int[] x = {1, 2}, y = {1, 2}; System.out.println((x == y) + " " + Arrays.equals(x, y)); } }
        expect: "false true"
      C:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              System.out.println(Arrays.binarySearch(new int[]{3, 1, 2}, 3)); } }
        expect: "-4"
      D:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              System.out.println(Arrays.compare(new int[]{1, 2}, new int[]{1, 3}) < 0); } }
        expect: "true"
      E:
        holds: false
        code: |
          public class P { public static void main(String[] a) {
              int[] x = {}; System.out.println(x.length); } }
        expect: "0"
    answer: [A, D]
    why: >-
      A: list của `asList` "nhìn" vào mảng gốc: `set` được (ghi xuống mảng), `add`/`remove` thì không.
      D: `Arrays.compare` so sánh từng phần tử theo thứ tự từ điển, trả về âm/0/dương.
    wrong:
      B: "`Arrays.equals` so sánh **nội dung** từng phần tử; `==` mới so sánh tham chiếu."
      C: "Với mảng chưa sắp xếp, kết quả là **không xác định (undefined)**, không phải luôn -1 (ví dụ ở đây là -4)."
      E: "`{}` là mảng rỗng, độ dài 0."

  - id: "05-17"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Views {
          public static void main(String[] args) {
              List<String> src = new ArrayList<>(List.of("x"));
              List<String> v = Collections.unmodifiableList(src);
              List<String> c = List.copyOf(src);
              src.add("y");
              System.out.println(v.size() + " " + c.size());
          }
      }
    expect: "2 1"
    options: {A: "1 1", B: "2 2", C: "2 1", D: "1 2"}
    answer: C
    why: >-
      `Collections.unmodifiableList` trả về một **view** chỉ đọc của list gốc: list gốc đổi thì view thấy. `List.copyOf`
      tạo **bản sao** bất biến tại thời điểm gọi.
    wrong:
      A: "View `v` phản ánh thay đổi của `src`."
      B: "`List.copyOf` là bản sao, không thấy phần tử thêm sau."
      D: "Ngược lại: view thay đổi theo, bản sao thì không."

