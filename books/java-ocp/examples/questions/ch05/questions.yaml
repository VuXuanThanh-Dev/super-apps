  - id: "05-19"
    level: medium
    topic: "5.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.*;

      public class Gen {
          static <T> T first(List<T> list) { return list.get(0); }

          public static void main(String[] args) {
              List<String> names = new ArrayList<>();                // L1
              String s = first(names);                               // L2
              Integer i = first(names);                              // L3
              Map<String, List<Integer>> m = new HashMap<>();        // L4
              List<> bad = new ArrayList<String>();                  // L5
          }
      }
    error_markers: [L3, L5]
    options: {A: Chỉ L3, B: L3 và L5, C: L2 và L3, D: L4 và L5, E: Chỉ L5}
    answer: B
    why: >-
      Với `List<String>`, `T` được suy ra là `String`, nên kết quả không gán cho `Integer` được (L3). Diamond `<>`
      chỉ được dùng sau `new`, không dùng ở kiểu khai báo (L5). L4 dùng diamond đúng cách.
    wrong:
      A: "L5 cũng lỗi: `List<>` ở vế trái không hợp lệ."
      C: "L2 hợp lệ: `T` = `String`."
      D: "L4 hợp lệ: diamond suy ra `HashMap<String, List<Integer>>`."
      E: "L3 cũng lỗi: không gán `String` cho `Integer`."

  - id: "05-20"
    level: easy
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Adds {
          public static void main(String[] args) {
              List<String> l = new ArrayList<>();
              l.add("x");
              l.add(0, "y");
              l.add("z");
              l.set(1, "w");
              System.out.println(l + " " + l.indexOf("z"));
          }
      }
    expect: "[y, w, z] 2"
    options: {A: "[y, w, z] 2", B: "[w, x, z] 2", C: "[y, x, w] -1", D: "[y, w, x, z] 3"}
    answer: A
    why: >-
      [x] → `add(0, "y")` chèn đầu → [y, x] → thêm cuối → [y, x, z] → `set(1, "w")` **thay** phần tử ở chỉ số 1 →
      [y, w, z]. `indexOf("z")` = 2.
    wrong:
      B: "`add(0, \"y\")` chèn `y` vào đầu, sau đó `set(1, ...)` thay `x` chứ không thay `y`."
      C: "`set(1, ...)` thay chỉ số 1 (là `x`), không phải chỉ số 2."
      D: "`set` thay thế, không chèn thêm."
