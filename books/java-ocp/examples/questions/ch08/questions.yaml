meta:
  chapter: ch08
questions:
  - id: "08-01"
    level: easy
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class RunStart {
          public static void main(String[] args) throws InterruptedException {
              Thread t = new Thread(() -> System.out.print(Thread.currentThread().getName() + " "), "worker");
              t.run();
              t.start();
              t.join();
          }
      }
    expect: "main worker"
    options: {A: "main worker", B: "worker worker", C: "main main", D: "worker main"}
    answer: A
    why: >-
      `run()` chỉ là một lời gọi method bình thường, chạy trên thread hiện tại (`main`). `start()` mới tạo thread mới và
      thread đó gọi `run()` → tên `worker`. `join()` đợi thread `worker` in xong.
    wrong:
      B: "`t.run()` không tạo thread mới; nó chạy trên `main`."
      C: "`t.start()` chạy lambda trên thread mới tên `worker`."
      D: "`t.run()` được gọi trước và chạy đồng bộ trên `main`."

  - id: "08-02"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.*;

      public class Fail {
          public static void main(String[] args) {
              ExecutorService ex = Executors.newSingleThreadExecutor();
              Future<Integer> f = ex.submit(() -> Integer.parseInt("x1"));
              try {
                  System.out.println(f.get());
              } catch (ExecutionException e) {
                  System.out.println("EE:" + e.getCause().getClass().getSimpleName());
              } catch (InterruptedException e) {
                  System.out.println("IE");
              } finally {
                  ex.shutdown();
              }
          }
      }
    expect: "EE:NumberFormatException"
    opt_style: text
    options:
      A: "Ném `NumberFormatException` ra khỏi `main`"
      B: "`EE:ExecutionException`"
      C: "`null`"
      D: "`EE:NumberFormatException`"
    answer: D
    why: >-
      Exception xảy ra **bên trong task** không bay thẳng ra thread gọi. `Future.get()` gói nó vào `ExecutionException`;
      exception gốc lấy bằng `getCause()`.
    wrong:
      A: "Exception trong task được gói lại, `main` nhận `ExecutionException`."
      B: "`getCause()` trả về exception gốc (`NumberFormatException`), không phải chính `ExecutionException`."
      C: "Task thất bại nên `get()` ném exception, không trả về `null`."

  - id: "08-03"
    level: medium
    topic: "8.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.concurrent.*;

      public class Tasks {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newFixedThreadPool(1);
              Future<?> a = ex.submit(() -> System.out.println("a"));        // L1
              Future<String> b = ex.submit(() -> "b");                       // L2
              Callable<Void> c = () -> { Thread.sleep(10); return null; };   // L3
              Runnable d = () -> { Thread.sleep(10); };                      // L4
              Future<Integer> e = ex.submit(() -> { return; });              // L5
              ex.shutdown();
          }
      }
    error_markers: [L4, L5]
    options: {A: Chỉ L4, B: L4 và L5, C: L3 và L4, D: "L3, L4 và L5", E: Chỉ L5}
    answer: B
    why: >-
      `Runnable.run()` không khai báo `throws`, nên lambda Runnable không được ném checked exception như
      `InterruptedException` của `Thread.sleep` (L4). Lambda `() -> { return; }` không trả giá trị nên chỉ khớp `Runnable`;
      `submit(Runnable)` trả về `Future<?>`, không gán được cho `Future<Integer>` (L5).
    wrong:
      A: "L5 cũng lỗi: lambda không trả giá trị → `submit(Runnable)` → `Future<?>`."
      C: "`Callable.call()` khai báo `throws Exception`, nên L3 được phép gọi `Thread.sleep`."
      D: "L3 hợp lệ (xem C)."
      E: "L4 cũng lỗi vì checked exception trong Runnable."

  - id: "08-04"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class States {
          public static void main(String[] args) throws InterruptedException {
              Thread t = new Thread(() -> { });
              System.out.print(t.getState() + " ");
              t.start();
              t.join();
              System.out.print(t.getState() + " " + t.isAlive());
          }
      }
    expect: "NEW TERMINATED false"
    options: {A: "NEW RUNNABLE true", B: "CREATED TERMINATED false", C: "NEW TERMINATED false", D: "NEW DEAD false"}
    answer: C
    why: >-
      Thread vừa tạo (chưa `start()`) ở trạng thái `NEW`. Sau `join()`, thread chắc chắn đã chạy xong → `TERMINATED`
      và `isAlive()` là `false`.
    wrong:
      A: "`join()` đợi thread kết thúc, nên không còn `RUNNABLE`."
      B: "Không có trạng thái `CREATED` trong `Thread.State`; trạng thái đầu là `NEW`."
      D: "Không có trạng thái `DEAD`; trạng thái cuối là `TERMINATED`."

  - id: "08-05"
    level: medium
    topic: "8.1"
    q: Hai phát biểu nào đúng về virtual thread (Java 21)?
    kind: proofs
    options:
      A: "Virtual thread luôn là daemon thread."
      B: "`Thread.ofVirtual().start(r)` trả về một thread đã được start."
      C: "`new Thread(r)` tạo ra một virtual thread."
      D: "Có thể gọi `setDaemon(false)` trên virtual thread."
      E: "`Executors.newVirtualThreadPerTaskExecutor()` giới hạn số thread chạy cùng lúc bằng số CPU."
    proofs:
      A:
        holds: true
        code: |
          public class P { public static void main(String[] a) throws Exception {
              Thread t = Thread.ofVirtual().unstarted(() -> { });
              System.out.println(t.isDaemon()); } }
        expect: "true"
      B:
        holds: true
        code: |
          public class P { public static void main(String[] a) throws Exception {
              Thread t = Thread.ofVirtual().start(() -> { });
              System.out.println(t.getState() != Thread.State.NEW); t.join(); } }
        expect: "true"
      C:
        holds: false
        code: |
          public class P { public static void main(String[] a) {
              System.out.println(new Thread(() -> { }).isVirtual()); } }
        expect: "false"
      D:
        holds: false
        code: |
          public class P { public static void main(String[] a) {
              Thread.ofVirtual().unstarted(() -> { }).setDaemon(false); } }
        expect_exception: IllegalArgumentException
      E:
        holds: false
        code: |
          import java.util.concurrent.*;
          public class P { public static void main(String[] a) throws Exception {
              int n = 200;
              CountDownLatch allRunning = new CountDownLatch(n);
              try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {
                  for (int i = 0; i < n; i++) ex.submit(() -> { allRunning.countDown(); allRunning.await(); return null; });
              }
              System.out.println(n + " tasks were running at the same time"); } }
        expect: "200 tasks were running at the same time"
    answer: [A, B]
    why: >-
      A: virtual thread luôn là daemon (JVM không đợi chúng khi thoát). B: `start(...)` của `Thread.Builder` tạo và start
      thread luôn (khác `unstarted(...)`).
    wrong:
      C: "Constructor `Thread` tạo **platform thread**; virtual thread tạo qua `Thread.ofVirtual()`, `Thread.startVirtualThread` hoặc executor."
      D: "Đổi virtual thread thành non-daemon → `IllegalArgumentException`."
      E: "Executor này tạo **một virtual thread mới cho mỗi task**, không giới hạn theo số CPU (ví dụ: 200 task cùng chờ nhau vẫn chạy xong)."

  - id: "08-06"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.concurrent.*;

      public class AllOf {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newFixedThreadPool(3);
              List<Callable<Integer>> tasks = List.of(
                      () -> { Thread.sleep(200); return 1; },
                      () -> 2,
                      () -> { Thread.sleep(100); return 3; });
              StringBuilder sb = new StringBuilder();
              for (Future<Integer> f : ex.invokeAll(tasks)) sb.append(f.get());
              ex.shutdown();
              System.out.println(sb);
          }
      }
    expect: "123"
    opt_style: text
    options: {A: "`213`", B: "`231`", C: "`123`", D: "Thứ tự không xác định"}
    answer: C
    why: >-
      `invokeAll` đợi **tất cả** task xong và trả về list `Future` theo **đúng thứ tự của list task**, không theo thứ tự
      hoàn thành.
    wrong:
      A: "Đây là thứ tự hoàn thành; `invokeAll` giữ thứ tự của danh sách đầu vào."
      B: "Như A — thứ tự kết quả là thứ tự task."
      D: "Thứ tự list kết quả được bảo đảm khớp với list task."

  - id: "08-07"
    level: hard
    topic: "8.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.atomic.AtomicInteger;

      public class Atom {
          public static void main(String[] args) {
              AtomicInteger a = new AtomicInteger(10);
              int x = a.getAndAdd(5);
              int y = a.incrementAndGet();
              boolean z = a.compareAndSet(15, 0);
              int w = a.updateAndGet(v -> v * 2);
              System.out.println(x + " " + y + " " + z + " " + w);
          }
      }
    expect: "10 16 false 32"
    options: {A: "15 16 true 0", B: "10 16 true 0", C: "15 17 false 34", D: "10 16 false 32"}
    answer: D
    why: >-
      `getAndAdd(5)` trả về giá trị **cũ** (10), a = 15. `incrementAndGet()` trả về giá trị **mới** (16).
      `compareAndSet(15, 0)` thất bại vì giá trị hiện tại là 16 → `false`, không đổi. `updateAndGet(v * 2)` → 32.
    wrong:
      A: "`getAndXxx` trả về giá trị trước khi đổi; và compareAndSet thất bại vì a đang là 16."
      B: "compareAndSet chỉ thành công khi giá trị hiện tại **bằng đúng** giá trị mong đợi (15), mà a là 16."
      C: "`getAndAdd` trả về 10 (giá trị cũ), và `incrementAndGet` chỉ tăng một lần."

  - id: "08-08"
    level: medium
    topic: "8.2"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Sync {
          private final Object lock = new Object();
          private int count;

          synchronized void a() { count++; }                        // L1
          void b() { synchronized (lock) { count++; } }             // L2
          void c() { synchronized (count) { count++; } }            // L3
          static synchronized void d() { }                          // L4
          synchronized Sync() { }                                   // L5

          public static void main(String[] args) { }
      }
    error_markers: [L3, L5]
    options: {A: Chỉ L3, B: L3 và L5, C: L4 và L5, D: L1 và L3, E: Chỉ L5}
    answer: B
    why: >-
      Khối `synchronized (x)` cần `x` là **tham chiếu object**; `count` là `int` → L3 lỗi. Constructor không được khai báo
      `synchronized` → L5 lỗi. Method instance và static đều có thể `synchronized` (khoá trên `this` hoặc trên `Sync.class`).
    wrong:
      A: "L5 cũng lỗi: constructor không dùng được `synchronized`."
      C: "`static synchronized` hợp lệ (khoá trên object `Class`)."
      D: "Method `synchronized` (L1) hợp lệ."
      E: "L3 cũng lỗi vì primitive không làm khoá được."

  - id: "08-09"
    level: medium
    topic: "8.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.locks.ReentrantLock;

      public class Holds {
          public static void main(String[] args) {
              ReentrantLock lock = new ReentrantLock();
              lock.lock();
              lock.lock();
              System.out.print(lock.getHoldCount() + " ");
              lock.unlock();
              System.out.print(lock.isLocked() + " ");
              lock.unlock();
              System.out.print(lock.isLocked() + " ");
              try {
                  lock.unlock();
              } catch (IllegalMonitorStateException e) {
                  System.out.print("IMSE");
              }
          }
      }
    expect: "2 true false IMSE"
    options: {A: "2 true false IMSE", B: "2 false false IMSE", C: "1 true false IMSE", D: "2 true false"}
    answer: A
    why: >-
      `ReentrantLock` cho phép cùng một thread `lock()` nhiều lần; mỗi lần tăng hold count. Phải `unlock()` đúng số lần
      mới thật sự mở khoá. `unlock()` khi không giữ khoá → `IllegalMonitorStateException`.
    wrong:
      B: "Sau lần `unlock()` đầu, hold count còn 1 nên khoá vẫn đang bị giữ."
      C: "Khoá được lấy hai lần nên hold count là 2."
      D: "`unlock()` thêm lần nữa khi không giữ khoá sẽ ném exception."

  - id: "08-10"
    level: hard
    topic: "8.2"
    q: Hai phát biểu nào đúng?
    kind: proofs
    options:
      A: "`ConcurrentHashMap` không cho phép key `null`."
      B: "`CopyOnWriteArrayList` cho phép thêm phần tử trong lúc đang duyệt bằng for-each mà không ném `ConcurrentModificationException`."
      C: "Gọi `unlock()` trên `ReentrantLock` mà thread không giữ thì không có gì xảy ra."
      D: "`AtomicInteger.getAndIncrement()` trả về giá trị sau khi tăng."
      E: "`ArrayBlockingQueue.offer(e)` chặn (block) khi hàng đợi đầy."
    proofs:
      A:
        holds: true
        code: |
          import java.util.concurrent.*;
          public class P { public static void main(String[] a) {
              new ConcurrentHashMap<String, Integer>().put(null, 1); } }
        expect_exception: NullPointerException
      B:
        holds: true
        code: |
          import java.util.*;
          import java.util.concurrent.*;
          public class P { public static void main(String[] a) {
              List<Integer> l = new CopyOnWriteArrayList<>(List.of(1, 2));
              for (Integer i : l) l.add(i);
              System.out.println(l); } }
        expect: "[1, 2, 1, 2]"
      C:
        holds: false
        code: |
          import java.util.concurrent.locks.*;
          public class P { public static void main(String[] a) { new ReentrantLock().unlock(); } }
        expect_exception: IllegalMonitorStateException
      D:
        holds: false
        code: |
          import java.util.concurrent.atomic.*;
          public class P { public static void main(String[] a) {
              System.out.println(new AtomicInteger(5).getAndIncrement()); } }
        expect: "5"
      E:
        holds: false
        code: |
          import java.util.concurrent.*;
          public class P { public static void main(String[] a) {
              BlockingQueue<Integer> q = new ArrayBlockingQueue<>(1);
              q.offer(1);
              System.out.println(q.offer(2)); } }
        expect: "false"
    answer: [A, B]
    why: >-
      A: `ConcurrentHashMap` cấm cả key lẫn value `null`. B: `CopyOnWriteArrayList` tạo bản sao mảng mỗi lần ghi; iterator
      duyệt ảnh chụp cũ nên không ném exception.
    wrong:
      C: "`unlock()` khi không giữ khoá ném `IllegalMonitorStateException`."
      D: "`getAndIncrement()` trả về giá trị **cũ** (5); `incrementAndGet()` mới trả về giá trị mới."
      E: "`offer` trả về `false` ngay khi đầy; `put` mới là method chặn."

  - id: "08-11"
    level: medium
    topic: "8.3"
    q: Điều gì đúng về kết quả của chương trình?
    kind: output
    code: |
      import java.util.*;

      public class Ordered {
          public static void main(String[] args) {
              StringBuilder sb = new StringBuilder();
              List.of(1, 2, 3, 4, 5).parallelStream()
                      .map(x -> x * x)
                      .forEachOrdered(x -> sb.append(x).append(','));
              System.out.println(sb);
          }
      }
    expect: "1,4,9,16,25,"
    opt_style: text
    options:
      A: "Luôn in `1,4,9,16,25,`"
      B: "In các số theo thứ tự bất kỳ"
      C: "Ném `ConcurrentModificationException`"
      D: "Không biên dịch được vì `sb` được sửa trong lambda"
    answer: A
    why: >-
      `forEachOrdered` xử lý phần tử theo **thứ tự gặp (encounter order)** của nguồn có thứ tự (`List`), kể cả khi stream
      song song, và không gọi action đồng thời. Vì vậy output luôn giống nhau.
    wrong:
      B: "Đó là hành vi của `forEach` trên parallel stream."
      C: "Không có collection nào bị sửa khi đang duyệt."
      D: "`sb` là effectively final (không bị gán lại); gọi method trên object là được phép."

  - id: "08-12"
    level: medium
    topic: "8.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.CountDownLatch;

      public class Latch {
          public static void main(String[] args) throws InterruptedException {
              CountDownLatch latch = new CountDownLatch(2);
              latch.countDown();
              latch.countDown();
              latch.countDown();
              latch.await();
              System.out.println(latch.getCount());
          }
      }
    expect: "0"
    opt_style: text
    options:
      A: "`-1`"
      B: "Ném `IllegalStateException`"
      C: "Chương trình bị treo (chờ mãi ở `await()`)"
      D: "`0`"
    answer: D
    why: >-
      `countDown()` khi count đã về 0 thì không làm gì (không âm). `await()` trả về ngay khi count là 0.
    wrong:
      A: "Count không bao giờ âm."
      B: "Gọi `countDown()` thừa không ném exception."
      C: "Count đã về 0 nên `await()` không chờ."

  - id: "08-13"
    level: medium
    topic: "8.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.concurrent.*;

      public class Exec {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newCachedThreadPool();
              ex.execute(() -> System.out.println("x"));               // L1
              Future<?> f = ex.execute(() -> System.out.println("y"));  // L2
              Future<String> g = ex.submit(() -> "z");                  // L3
              ex.execute(() -> "w");                                    // L4
              ex.shutdown();
          }
      }
    error_markers: [L2, L4]
    options: {A: Chỉ L2, B: Chỉ L4, C: L2 và L4, D: L3 và L4, E: L1 và L2}
    answer: C
    why: >-
      `execute(Runnable)` (của `Executor`) trả về `void` → không gán cho `Future` được (L2). `execute` chỉ nhận `Runnable`;
      lambda `() -> "w"` trả về giá trị và `"w"` không phải một câu lệnh hợp lệ cho `void` → không khớp `Runnable` (L4).
      `submit` có bản nhận `Callable` nên L3 hợp lệ.
    wrong:
      A: "L4 cũng lỗi: `execute` không nhận `Callable`."
      B: "L2 cũng lỗi: `execute` trả về `void`."
      D: "`submit(Callable<String>)` trả về `Future<String>` → L3 hợp lệ."
      E: "L1 hợp lệ: `execute` nhận `Runnable`."

  - id: "08-14"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.*;

      public class Shut {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newSingleThreadExecutor();
              ex.submit(() -> System.out.print("A ")).get();
              ex.shutdown();
              try {
                  ex.submit(() -> System.out.print("B "));
              } catch (RejectedExecutionException e) {
                  System.out.print("R ");
              }
              ex.awaitTermination(1, TimeUnit.SECONDS);
              System.out.print(ex.isTerminated());
          }
      }
    expect: "A R true"
    options: {A: "A B true", B: "A R true", C: "A R false", D: "R A true"}
    answer: B
    why: >-
      Task đầu chạy xong (`get()` đợi). Sau `shutdown()`, executor **từ chối** task mới → `RejectedExecutionException`.
      Không còn task nào nên `awaitTermination` kết thúc và `isTerminated()` là `true`.
    wrong:
      A: "Sau `shutdown()`, không nhận task mới."
      C: "Không còn task đang chạy, nên executor kết thúc (terminated) ngay."
      D: "`get()` đợi task đầu in `A ` trước khi `main` tiếp tục."

  - id: "08-15"
    level: hard
    topic: "8.1"
    q: Chèn dòng nào vào chỗ `// INSERT CODE HERE` thì chương trình biên dịch và in ra `4`?
    kind: variants
    criterion: {output: "4"}
    template: |
      import java.util.*;
      import java.util.concurrent.*;

      public class Wait {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newFixedThreadPool(2);
              Callable<Integer> task = () -> 2 + 2;
              /*INSERT*/
              ex.shutdown();
          }
      }
    options:
      A: "System.out.println(ex.submit(task).get());"
      B: "System.out.println(ex.submit(task));"
      C: "System.out.println(ex.invokeAll(List.of(task)).get(0).get());"
      D: "System.out.println(ex.invokeAny(List.of(task)));"
      E: "ex.execute(task);"
    answer: [A, C, D]
    why: >-
      A: `submit` trả về `Future`, `get()` đợi và lấy kết quả. C: `invokeAll` trả về list `Future`. D: `invokeAny` trả
      về **trực tiếp** kết quả của một task hoàn thành thành công.
    wrong:
      B: "In ra `toString()` của `Future` (dạng `java.util.concurrent.FutureTask@...`), không phải 4."
      E: "`execute` chỉ nhận `Runnable`, không nhận `Callable` → lỗi biên dịch."

  - id: "08-16"
    level: medium
    topic: "8.2, 8.3"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.concurrent.*;

      public class Cow {
          public static void main(String[] args) {
              List<Integer> list = new CopyOnWriteArrayList<>(List.of(1, 2, 3));
              int count = 0;
              for (Integer i : list) {
                  list.add(i * 10);
                  count++;
              }
              System.out.println(count + " " + list.size());
          }
      }
    expect: "3 6"
    opt_style: text
    options:
      A: "`6 6`"
      B: "Ném `ConcurrentModificationException`"
      C: "`3 6`"
      D: "Vòng lặp chạy mãi"
    answer: C
    why: >-
      Iterator của `CopyOnWriteArrayList` duyệt **ảnh chụp** tại lúc tạo iterator (3 phần tử). Các phần tử thêm sau không
      được duyệt, nhưng vẫn nằm trong list → size 6.
    wrong:
      A: "Vòng lặp chỉ thấy 3 phần tử của ảnh chụp ban đầu."
      B: "`CopyOnWriteArrayList` không ném exception này."
      D: "Phần tử mới không được đưa vào vòng lặp đang chạy, nên vòng lặp kết thúc."

  - id: "08-17"
    level: hard
    topic: "8.3, 6.2"
    q: >-
      Điền thao tác nào vào **cả hai** chỗ `___` thì kết quả tuần tự và song song giống nhau (in ra `same`)?
    kind: variants
    criterion: {output: "same"}
    placeholder: "___"
    template: |
      import java.util.stream.*;

      public class Assoc {
          public static void main(String[] args) {
              int seq = IntStream.rangeClosed(1, 5)./*INSERT*/;
              int par = IntStream.rangeClosed(1, 5).parallel()./*INSERT*/;
              System.out.println(seq == par ? "same" : "different");
          }
      }
    options:
      A: "reduce(0, Integer::sum)"
      B: "reduce(1, (a, b) -> a * b)"
      C: "reduce(0, (a, b) -> a - b)"
      D: "reduce(5, Integer::sum)"
      E: "reduce(Integer.MIN_VALUE, Integer::max)"
    answer: [A, B, E]
    why: >-
      `reduce` song song đúng khi identity là phần tử trung hoà thật và hàm có tính **kết hợp (associative)**. Cộng với 0,
      nhân với 1, `max` với `Integer.MIN_VALUE` đều thoả.
    wrong:
      C: "Phép trừ không kết hợp: (a - b) - c ≠ a - (b - c). Kết quả song song phụ thuộc cách chia (trên máy kiểm tra: khác tuần tự)."
      D: "5 không phải identity của phép cộng; mỗi phần nhỏ đều cộng thêm 5 nên kết quả song song lớn hơn."

  - id: "08-18"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Builders {
          public static void main(String[] args) {
              Thread v = Thread.ofVirtual().name("v-", 1).unstarted(() -> { });
              Thread p = Thread.ofPlatform().name("p").unstarted(() -> { });
              System.out.println(v.getName() + " " + v.isVirtual() + " " + p.isVirtual() + " " + v.getState());
          }
      }
    expect: "v-1 true false NEW"
    options: {A: "v- true false NEW", B: "v-1 true false NEW", C: "v-1 true false RUNNABLE", D: "v-1 false false NEW"}
    answer: B
    why: >-
      `name(prefix, start)` đặt tên = prefix + số đếm (bắt đầu từ `start`) → `v-1`. `unstarted` tạo thread nhưng chưa chạy
      → `NEW`. `ofVirtual` tạo virtual thread, `ofPlatform` tạo platform thread.
    wrong:
      A: "`name(\"v-\", 1)` nối thêm số đếm vào tên."
      C: "`unstarted` không start thread."
      D: "`Thread.ofVirtual()` tạo virtual thread → `isVirtual()` là `true`."

  - id: "08-19"
    level: easy
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class JoinOrder {
          public static void main(String[] args) throws InterruptedException {
              StringBuilder sb = new StringBuilder();
              Thread t = new Thread(() -> sb.append("T"));
              sb.append("A");
              t.start();
              t.join();
              sb.append("B");
              System.out.println(sb);
          }
      }
    expect: "ATB"
    opt_style: text
    options: {A: "`ATB`", B: "`TAB`", C: "`AB`", D: "Thứ tự không xác định"}
    answer: A
    why: >-
      `A` được thêm trước khi start thread. `join()` làm `main` đợi thread `t` kết thúc (và bảo đảm thấy được thay đổi của
      nó), rồi mới thêm `B`. Vì vậy luôn là `ATB`.
    wrong:
      B: "Thread `t` chỉ bắt đầu sau khi `A` đã được thêm."
      C: "`join()` đợi thread `t` chạy xong, nên `T` chắc chắn đã được thêm."
      D: "`start()` sau `A` và `join()` trước `B` làm thứ tự được xác định."

  - id: "08-20"
    level: medium
    topic: "8.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.*;

      public class Queue {
          public static void main(String[] args) {
              BlockingQueue<String> q = new ArrayBlockingQueue<>(2);
              System.out.print(q.offer("a") + " " + q.offer("b") + " " + q.offer("c") + " ");
              System.out.print(q.poll() + " " + q.peek() + " " + q.size());
          }
      }
    expect: "true true false a b 1"
    options:
      A: "true true true a b 2"
      B: "true true false a a 1"
      C: "true true false b b 1"
      D: "true true false a b 1"
    answer: D
    why: >-
      Sức chứa là 2: `offer("c")` trả về `false` (không chặn). `poll()` lấy và xoá phần tử đầu (`a`). `peek()` chỉ xem
      phần tử đầu mới (`b`). Còn lại 1 phần tử.
    wrong:
      A: "Hàng đợi đầy sau 2 phần tử nên `offer(\"c\")` thất bại."
      B: "`poll()` đã xoá `a`, nên `peek()` thấy `b`."
      C: "Queue là FIFO: `poll()` lấy `a` (vào trước)."
