    why: >-
      `Base` chỉ có `Base(int)`. L2: constructor không gọi `super(...)` nên compiler thêm `super()` → không tồn tại.
      L4: default constructor ngầm cũng gọi `super()` → lỗi. L5: field `final` không được gán trong constructor.
    wrong:
      A: "L5 cũng lỗi: field `final` phải được gán trong mọi constructor."
      B: "L4 cũng lỗi: default constructor gọi `super()` ngầm."
      C: "L2 cũng lỗi vì `super()` ngầm."
