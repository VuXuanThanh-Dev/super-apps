      `a.then(b)` chạy `a` trước rồi `b`: (5 + 1) * 2 = 12; 5 * 2 + 1 = 11; id(0) + 1 = 1. Interface vẫn là functional
      interface vì chỉ có một method abstract (`calc`).
    wrong:
      A: "`then` chạy hàm hiện tại trước, hàm tham số sau."
      C: "`id().then(inc)` cộng 1 sau khi trả về 0."
