      B: "L3 hợp lệ: `String::charAt` khớp `BiFunction<String, Integer, Character>` (unboxing/boxing)."
      C: "L6 hợp lệ; L5 lỗi."
      E: "L6 hợp lệ: lời gọi method có thể dùng làm thân lambda `void`."

