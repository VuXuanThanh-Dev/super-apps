      L5: `UnaryOperator<String>` phải trả về `String`, nhưng `s.length()` là `int`. L7: `Runnable.run()` là `void`, không
      `return 1` được. L6 hợp lệ: `Consumer` chấp nhận một biểu thức-câu-lệnh (giá trị bị bỏ). L3: `(s, i) -> s.charAt(i)`.
