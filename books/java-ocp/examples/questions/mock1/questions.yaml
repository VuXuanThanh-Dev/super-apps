      import java.io.*;

      public class Ser2 {
          static class Base implements Serializable { int b = 1; }

          static class Sub extends Base {
              int s = 2;
              transient int t = 3;
              static int st = 4;
              Sub() { b = 10; s = 20; t = 30; }
          }

          public static void main(String[] args) throws Exception {
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              try (var out = new ObjectOutputStream(bytes)) { out.writeObject(new Sub()); }
              Sub.st = 40;
              try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                  Sub x = (Sub) in.readObject();
                  System.out.println(x.b + " " + x.s + " " + x.t + " " + Sub.st);
              }
          }
      }
    expect: "10 20 0 40"
    options: {A: "10 20 30 4", B: "1 2 3 40", C: "10 20 0 40", D: "10 20 0 4"}
    answer: C
    why: >-
      `Sub` là Serializable (kế thừa từ `Base`), nên cả `b` và `s` được lưu/khôi phục và **không** constructor/initializer
      nào của chúng chạy khi đọc. `t` là `transient` → 0. `st` là static, không được lưu → giữ giá trị hiện tại 40.
    wrong:
      A: "`transient` không được lưu; `static` không được khôi phục từ file."
      B: "Khi deserialize, initializer của lớp Serializable không chạy; giá trị lấy từ dữ liệu đã lưu."
      D: "Static field thuộc lớp, không nằm trong dữ liệu serialize: giá trị hiện tại là 40."

