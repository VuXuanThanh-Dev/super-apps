meta:
  intro: |
    **Thời gian: 120 phút · 50 câu · Đậu: ≥ 34 câu đúng (68%).** Làm như thi thật: không IDE, không tra cứu, bấm giờ.
    Câu "chọn N đáp án" chỉ tính điểm khi chọn đúng đủ N đáp án. Mọi câu hỏi đều tự viết và đã được biên dịch/chạy
    bằng JDK 21.0.10 để xác nhận đáp án (code: `examples/questions/mock1/`).
questions:
  - id: "M1-01"
    level: medium
    topic: "3.5"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      class A {
          void m(Object o) { System.out.print("AO "); }
          void m(String s) { System.out.print("AS "); }
      }

      class B extends A {
          @Override void m(Object o) { System.out.print("BO "); }
      }

      public class Mix {
          public static void main(String[] args) {
              A a = new B();
              Object o = "x";
              a.m(o);
              a.m("x");
              a.m(null);
          }
      }
    expect: "BO AS AS"
    options: {A: "BO BO BO", B: "AO AS AS", C: "BO AS BO", D: "BO AS AS"}
    answer: D
    why: >-
      Overload được chọn **lúc biên dịch** theo kiểu tĩnh của tham số; override được chọn **lúc chạy** theo object.
      `a.m(o)`: `o` kiểu `Object` → `m(Object)`, bị `B` override → `BO`. `a.m("x")` → `m(String)` (không bị override) → `AS`.
      `a.m(null)` → chọn bản cụ thể nhất `m(String)` → `AS`.
    wrong:
      A: "Chọn overload dựa trên kiểu tĩnh của tham số; `\"x\"` và `null` chọn `m(String)`."
      B: "`m(Object)` bị `B` override, nên lời gọi với `Object` in `BO`."
      C: "`null` khớp cả hai overload; compiler chọn `m(String)` vì cụ thể hơn."

  - id: "M1-02"
    level: medium
    topic: "1.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Expr {
          public static void main(String[] args) {
              int x = 10;
              long y = x++ + ++x * 2L;
              double z = y / 4;
              System.out.println(x + " " + y + " " + z);
          }
      }
    expect: "12 34 8.0"
    options: {A: "12 34 8.0", B: "12 34 8.5", C: "11 34 8.0", D: "12 32 8.0"}
    answer: A
    why: >-
      `x++` cho 10 (x = 11), `++x` cho 12 (x = 12); `12 * 2L = 24`; `y = 10 + 24 = 34`. `y / 4` là phép chia **long**
      (= 8) rồi mới đổi sang `double` → `8.0`.
    wrong:
      B: "`y / 4` chia hai số nguyên (long) trước khi gán cho `double`."
      C: "`x` tăng hai lần (`x++` và `++x`) → 12."
      D: "`++x` cho 12, không phải 11: 10 + 12 * 2 = 34."

  - id: "M1-03"
    level: medium
    topic: "6.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Chars {
          public static void main(String[] args) {
              String r = Stream.of("delta", "alpha", "charlie", "bravo")
                      .filter(s -> s.length() == 5)
                      .map(s -> s.charAt(0))
                      .sorted(Comparator.reverseOrder())
                      .map(String::valueOf)
                      .collect(Collectors.joining());
              System.out.println(r);
          }
      }
    expect: "dba"
    options: {A: "dab", B: "abd", C: "dba", D: "dbac"}
    answer: C
    why: >-
      Giữ các từ 5 ký tự: delta, alpha, bravo → ký tự đầu d, a, b → sắp xếp giảm dần d, b, a → nối lại `dba`.
    wrong:
      A: "`sorted(Comparator.reverseOrder())` sắp xếp lại, không giữ thứ tự gặp."
      B: "Đây là thứ tự tăng dần; comparator là `reverseOrder()`."
      D: "`charlie` có 7 ký tự nên bị loại."

  - id: "M1-04"
    level: medium
    topic: "2.1, 3.5"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Shapes {
          sealed interface Shape permits Circle, Rect { }
          record Circle(double r) implements Shape { }
          record Rect(double w, double h) implements Shape { }

          static String kind(Shape s) {
              return switch (s) {
                  case Circle c when c.r() > 10 -> "big circle";
                  case Circle c -> "circle";
                  case Rect(double w, double h) when w == h -> "square";
                  case Rect r -> "rect";
              };
          }

          public static void main(String[] args) {
              System.out.println(kind(new Circle(5)) + ", " + kind(new Rect(2, 2)) + ", "
                      + kind(new Circle(11)) + ", " + kind(new Rect(1, 3)));
          }
      }
    expect: "circle, square, big circle, rect"
    opt_style: text
    options:
      A: "`circle, rect, big circle, rect`"
      B: "`circle, square, big circle, rect`"
      C: "Không biên dịch được: switch thiếu `default`"
      D: "`circle, square, circle, rect`"
    answer: B
    why: >-
      Switch trên sealed interface phủ đủ `Circle` và `Rect` (mỗi loại có một case không guard) nên không cần `default`.
      Guard được kiểm tra theo thứ tự: Circle(5) → `circle`, Rect(2,2) → `square`, Circle(11) → `big circle`, Rect(1,3) → `rect`.
    wrong:
      A: "Rect(2, 2) thoả guard `w == h` nên là `square`."
      C: "Sealed type + các case không guard cho mọi lớp con → switch đầy đủ."
      D: "Circle(11) thoả guard `c.r() > 10`."

  - id: "M1-05"
    level: hard
    topic: "3.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Order {
          static int s = print("s1");
          int i = print("i1");
          static { print("sb"); }
          { print("ib"); }
          Order() { print("c"); }

          static int print(String t) {
              System.out.print(t + " ");
              return 0;
          }

          public static void main(String[] args) {
              print("main");
              new Order();
              new Order();
          }
      }
    expect: "s1 sb main i1 ib c i1 ib c"
    options:
      A: "main s1 sb i1 ib c i1 ib c"
      B: "s1 sb main i1 ib c"
      C: "s1 sb main ib i1 c ib i1 c"
      D: "s1 sb main i1 ib c i1 ib c"
    answer: D
    why: >-
      Lớp `Order` được khởi tạo trước khi `main` chạy: static field và static block theo thứ tự xuất hiện (`s1`, `sb`).
      Mỗi `new Order()`: field và instance block theo thứ tự xuất hiện (`i1`, `ib`), rồi constructor (`c`).
    wrong:
      A: "Khởi tạo static của lớp chứa `main` xảy ra trước khi `main` chạy."
      B: "Có hai lần `new Order()`, mỗi lần chạy lại phần khởi tạo instance."
      C: "Field `i` khai báo trước instance block nên chạy trước."

  - id: "M1-06"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Group {
          public static void main(String[] args) {
              Map<String, List<Integer>> m = new TreeMap<>();
              for (String w : "b1 a2 b3 c4 a5".split(" "))
                  m.computeIfAbsent(w.substring(0, 1), k -> new ArrayList<>()).add(Integer.parseInt(w.substring(1)));
              System.out.println(m + " " + m.getOrDefault("z", List.of()).size());
          }
      }
    expect: "{a=[2, 5], b=[1, 3], c=[4]} 0"
    options:
      A: "{a=[2, 5], b=[1, 3], c=[4]} 0"
      B: "{b=[1, 3], a=[2, 5], c=[4]} 0"
      C: "{a=[5], b=[3], c=[4]} 0"
      D: "{a=[2, 5], b=[1, 3], c=[4]} null"
    answer: A
    why: >-
      `computeIfAbsent` tạo list mới khi key chưa có và **trả về list hiện có** khi đã có, nên các số được cộng dồn.
      `TreeMap` sắp xếp key. `getOrDefault("z", List.of())` trả về list rỗng → size 0.
    wrong:
      B: "`TreeMap` sắp xếp key theo thứ tự tự nhiên: a, b, c."
      C: "`computeIfAbsent` không thay list cũ bằng list mới."
      D: "`getOrDefault` trả về giá trị mặc định (list rỗng), gọi `size()` được 0."

  - id: "M1-07"
    level: medium
    topic: "4.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Fin {
          static String test(int n) {
              StringBuilder sb = new StringBuilder();
              try {
                  sb.append("t");
                  if (n == 0) throw new IllegalStateException();
                  sb.append("u");
                  return sb.append("r").toString();
              } catch (IllegalStateException e) {
                  sb.append("c");
                  return sb.toString();
              } finally {
                  sb.append("f");
              }
          }

          public static void main(String[] args) {
              System.out.println(test(1) + " " + test(0));
          }
      }
    expect: "tur tc"
    options: {A: "turf tcf", B: "turf tc", C: "tur tc", D: "tu tc"}
    answer: C
    why: >-
      Biểu thức sau `return` được tính **trước** khi `finally` chạy: `toString()` tạo một `String` mới (`tur`, `tc`).
      `finally` sửa `sb` nhưng không đổi chuỗi đã được tạo để trả về.
    wrong:
      A: "`String` trả về đã được tạo trước `finally`; `sb.append(\"f\")` không ảnh hưởng tới nó."
      B: "Cả hai lời gọi đều trả về `String` được tạo trước `finally`."
      D: "`sb.append(\"r\")` nằm trong biểu thức return, được tính trước khi trả về."

  - id: "M1-08"
    level: hard
    topic: "3.6"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Conflict {
          interface Walk { default String go() { return "walk"; } }
          interface Run { default String go() { return "run"; } }
          interface Fly { String go(); }

          static class A implements Walk, Run { }                                                   // L1
          static class B implements Walk, Run { public String go() { return Walk.super.go(); } }   // L2
          static abstract class C implements Walk, Fly { }                                          // L3
          static class D implements Fly { public String go() { return "d"; } }                      // L4
          static class E implements Walk { public String go() { return "e" + Walk.super.go(); } }  // L5

          public static void main(String[] args) { }
      }
    error_markers: [L1, L3]
    options: {A: Chỉ L1, B: L1 và L3, C: "L1, L3 và L5", D: L3 và L5, E: L1 và L2}
    answer: B
    why: >-
      L1: kế thừa hai default `go()` không liên quan mà không override → lỗi. L3: kế thừa một default (`Walk`) và một
      abstract (`Fly`) cùng chữ ký từ hai interface không liên quan → "types Walk and Fly are incompatible", kể cả khi lớp là
      abstract. L2 override và chọn `Walk.super.go()`; L5 gọi `Walk.super` hợp lệ vì `E` implements trực tiếp `Walk`.
    wrong:
      A: "L3 cũng lỗi: default và abstract cùng chữ ký từ hai interface khác nhau vẫn xung đột, dù lớp là abstract."
      C: "L5 hợp lệ: `X.super.m()` dùng được với interface mà lớp implements trực tiếp."
      D: "L1 lỗi (xung đột hai default) và L5 hợp lệ."
      E: "L2 đã override `go()` nên hết xung đột."

  - id: "M1-09"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.concurrent.*;

      public class Exec {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newFixedThreadPool(2);
              Future<String> f1 = ex.submit(() -> "A");
              Future<?> f2 = ex.submit(() -> { });
              List<Future<Integer>> fs = ex.invokeAll(List.of(() -> 1, () -> 2));
              ex.shutdown();
              System.out.println(f1.get() + f2.get() + fs.get(1).get() + ex.isShutdown());
          }
      }
    expect: "Anull2true"
    options: {A: "A2true", B: "Anull1true", C: "Anull2false", D: "Anull2true"}
    answer: D
    why: >-
      `submit(Callable)` → `Future<String>` với kết quả `A`. `submit(Runnable)` → `get()` trả về `null`. `invokeAll` giữ thứ
      tự task: phần tử 1 là 2. Sau `shutdown()`, `isShutdown()` là `true` (task đã gửi vẫn lấy kết quả được).
    wrong:
      A: "`Future` của Runnable trả về `null`, và `null` được nối vào chuỗi."
      B: "`fs.get(1)` là task thứ hai (trả về 2)."
      C: "`isShutdown()` là `true` ngay sau khi gọi `shutdown()`."

  - id: "M1-10"
    level: medium
    topic: "1.3"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Sb {
          public static void main(String[] args) {
              String s = "Java";
              StringBuilder sb = new StringBuilder(s);
              s.concat("21");
              sb.append(21).insert(0, s.toLowerCase()).reverse();
              System.out.println(s + " " + sb + " " + sb.length());
          }
      }
    expect: "Java 12avaJavaj 10"
    options: {A: "Java 12avaJavaj 10", B: "Java21 12avaJavaj 10", C: "Java 12avaJava 9", D: "Java javaJava21 10"}
    answer: A
    why: >-
      `s.concat` không đổi `s` (bất biến). `sb`: `Java` → `Java21` → chèn `java` vào đầu → `javaJava21` → đảo ngược →
      `12avaJavaj` (10 ký tự).
    wrong:
      B: "Kết quả của `s.concat(\"21\")` không được gán lại."
      C: "`insert(0, \"java\")` thêm 4 ký tự; tổng là 10."
      D: "`reverse()` đã đảo ngược builder."

  - id: "M1-11"
    level: hard
    topic: "6.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Oldest {
          record P(String name, String city, int age) { }

          public static void main(String[] args) {
              List<P> ps = List.of(new P("An", "HN", 30), new P("Binh", "HCM", 25), new P("Chi", "HN", 22),
                      new P("Dung", "HCM", 40), new P("Em", "DN", 35));
              Map<String, Optional<P>> oldest = ps.stream().collect(Collectors.groupingBy(
                      P::city, TreeMap::new, Collectors.maxBy(Comparator.comparingInt(P::age))));
              oldest.forEach((k, v) -> System.out.print(k + "=" + v.map(P::name).orElse("-") + " "));
          }
      }
    expect: "DN=Em HCM=Dung HN=An"
    options:
      A: "HN=An HCM=Dung DN=Em"
      B: "DN=Em HCM=Binh HN=Chi"
      C: "DN=Em HCM=Dung HN=An"
      D: "DN=Optional[Em] HCM=Optional[Dung] HN=Optional[An]"
    answer: C
    why: >-
      `groupingBy` với `TreeMap::new` → key sắp xếp: DN, HCM, HN. `maxBy` theo tuổi trả về `Optional<P>` người lớn tuổi
      nhất mỗi nhóm; `v.map(P::name)` lấy tên.
    wrong:
      A: "`TreeMap` sắp xếp key tăng dần."
      B: "`maxBy` chọn tuổi lớn nhất: HCM là Dung (40), HN là An (30)."
      D: "`v.map(P::name).orElse(\"-\")` lấy ra chuỗi tên, không in `Optional`."

  - id: "M1-12"
    level: medium
    topic: "3.4"
    q: Chèn đoạn nào vào chỗ `// INSERT CODE HERE` thì chương trình biên dịch được?
    kind: variants
    criterion: compiles
    template: |
      public class Scope {
          int field = 1;

          void m() {
              /*INSERT*/
          }

          public static void main(String[] args) { }
      }
    options:
      A: "var list = java.util.List.of(1, 2); for (var i : list) System.out.print(i);"
      B: "var x = 1; x = \"one\";"
      C: "int field = field + 1;"
      D: "final var y = 3; int z = y * 2;"
      E: "var arr[] = new int[3];"
    answer: [A, D]
    why: >-
      A: `var` dùng được cho biến cục bộ và biến của for-each. D: `final var` hợp lệ.
    wrong:
      B: "`x` đã được suy ra kiểu `int`; không gán `String` được."
      C: "Biến cục bộ `field` che field cùng tên ngay từ chỗ khai báo; dùng nó trong chính initializer → \"might not have been initialized\"."
      E: "`var` không đi với `[]`."

  - id: "M1-13"
    level: medium
    topic: "9.3"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.nio.file.*;

      public class Paths1 {
          public static void main(String[] args) {
              Path base = Path.of("/app/config");
              Path p = base.resolve("../logs/./app.log").normalize();
              System.out.println(p + " " + p.getNameCount() + " " + base.relativize(p) + " " + p.startsWith("/app"));
          }
      }
    expect: "/app/logs/app.log 3 ../logs/app.log true"
    options:
      A: "/app/config/../logs/app.log 5 ../logs/app.log true"
      B: "/app/logs/app.log 3 ../logs/app.log true"
      C: "/app/logs/app.log 3 logs/app.log true"
      D: "/app/logs/app.log 2 ../logs/app.log false"
    answer: B
    why: >-
      `resolve` nối thành `/app/config/../logs/./app.log`; `normalize` bỏ `.` và `config/..` → `/app/logs/app.log`
      (3 phần: app, logs, app.log). Từ `/app/config` tới đó: lên một cấp rồi vào `logs/app.log`.
    wrong:
      A: "`normalize()` đã được gọi nên không còn `..` và `.`."
      C: "`relativize` phải đi lên khỏi `config` trước: `../logs/app.log`."
      D: "Gốc `/` không tính, còn 3 phần; và path bắt đầu bằng `/app`."

  - id: "M1-14"
    level: easy
    topic: "2.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Loop {
          public static void main(String[] args) {
              int sum = 0;
              for (int i = 0; i < 10; i++) {
                  if (i % 3 == 0) continue;
                  if (i > 7) break;
                  sum += i;
              }
              System.out.println(sum);
          }
      }
    expect: "19"
    options: {A: "27", B: "12", C: "25", D: "19"}
    answer: D
    why: >-
      Bỏ qua 0, 3, 6 (chia hết cho 3); cộng 1 + 2 + 4 + 5 + 7 = 19; tới 8 thì `break`.
    wrong:
      A: "`break` khi `i > 7` nên 8 không được cộng (9 bị `continue` trước)."
      B: "7 vẫn được cộng vì điều kiện dừng là `i > 7`."
      C: "0, 3, 6 bị `continue` nên không được cộng."

  - id: "M1-15"
    level: hard
    topic: "5.1"
    q: Kết quả của chương trình là gì?
    kind: output
    code: |
      import java.util.*;

      public class SubList {
          public static void main(String[] args) {
              List<Integer> base = new ArrayList<>(List.of(1, 2, 3, 4, 5));
              List<Integer> sub = base.subList(1, 4);
              sub.remove(Integer.valueOf(3));
              sub.add(9);
              base.set(0, 0);
              System.out.println(base + " " + sub);
          }
      }
    expect: "[0, 2, 4, 9, 5] [2, 4, 9]"
    opt_style: text
    options:
      A: "In ra `[0, 2, 4, 9, 5] [2, 4, 9]`"
      B: "In ra `[0, 2, 3, 4, 5] [2, 4, 9]`"
      C: "In ra `[0, 2, 4, 5, 9] [2, 4, 9]`"
      D: "Ném `ConcurrentModificationException`"
    answer: A
    why: >-
      `subList` là **view** của list gốc: xoá/thêm qua view cũng xoá/thêm trong list gốc (thêm ở cuối view = trước phần tử 5).
      `base.set` không đổi cấu trúc (không đổi kích thước) nên view vẫn hợp lệ.
    wrong:
      B: "`sub.remove(3)` xoá luôn trong `base`."
      C: "`sub.add(9)` chèn vào vị trí cuối **của view** (trước 5), không phải cuối list gốc."
      D: "Chỉ sửa cấu trúc list gốc trực tiếp (add/remove) mới làm view hỏng; `set` thì không."

  - id: "M1-16"
    level: medium
    topic: "3.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Outer {
          private int x = 1;

          class Inner {
              private int x = 2;
              int sum(int x) { return x + this.x + Outer.this.x; }
          }

          static class Nested {
              int get() { return new Outer().x; }
          }

          public static void main(String[] args) {
              Outer o = new Outer();
              o.x = 10;
              Outer.Inner in = o.new Inner();
              System.out.println(in.sum(100) + " " + new Nested().get());
          }
      }
    expect: "112 1"
    options: {A: "103 1", B: "112 10", C: "112 1", D: "103 10"}
    answer: C
    why: >-
      Trong `sum`: `x` = tham số (100), `this.x` = field của `Inner` (2), `Outer.this.x` = field của object ngoài `o` (10)
      → 112. `Nested` tạo một `Outer` mới nên `x` = 1. Lớp lồng truy cập được thành viên `private` của lớp ngoài.
    wrong:
      A: "`Outer.this.x` là field của object `o` đã đổi thành 10."
      B: "`Nested.get()` dùng một `Outer` **mới** (x = 1), không phải `o`."
      D: "Tổng là 100 + 2 + 10 = 112."

