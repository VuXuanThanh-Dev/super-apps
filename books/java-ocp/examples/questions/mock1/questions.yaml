    level: hard
    topic: "7.1"
    q: >-
      Module `com.api` export interface `com.api.Tax`; module `com.impl` có
      `provides com.api.Tax with com.impl.VatTax;` (rate 10). Điền nội dung `module-info.java` nào cho `com.app`
      (thay `// INSERT CODE HERE`) để chương trình in ra `rate=10`?
    kind: script_variants
    criterion: {output: "rate=10"}
    files:
      src/com.api/module-info.java: "module com.api { exports com.api; }"
      src/com.api/com/api/Tax.java: |
        package com.api;
        public interface Tax { int rate(); }
      src/com.impl/module-info.java: |
        module com.impl {
            requires com.api;
            provides com.api.Tax with com.impl.VatTax;
        }
      src/com.impl/com/impl/VatTax.java: |
        package com.impl;
        public class VatTax implements com.api.Tax { public int rate() { return 10; } }
      src/com.app/module-info.java: "/*INSERT*/"
      src/com.app/com/app/Main.java: |
        package com.app;
        import java.util.ServiceLoader;
        public class Main {
            public static void main(String[] args) {
                ServiceLoader.load(com.api.Tax.class).findFirst()
                        .ifPresent(t -> System.out.println("rate=" + t.rate()));
            }
        }
    show:
      src/com.app/com/app/Main.java: |
        package com.app;
        import java.util.ServiceLoader;
        public class Main {
            public static void main(String[] args) {
                ServiceLoader.load(com.api.Tax.class).findFirst()
                        .ifPresent(t -> System.out.println("rate=" + t.rate()));
            }
        }
    run: |
      if javac -d out --module-source-path src -m com.api,com.impl,com.app >/dev/null 2>&1; then
        java -p out -m com.app/com.app.Main 2>/dev/null
      else
        echo "compile error"
      fi
    options:
      A: "module com.app { requires com.api; uses com.api.Tax; }"
      B: "module com.app { requires com.api; }"
      C: "module com.app { requires com.api; requires com.impl; uses com.api.Tax; }"
      D: "module com.app { uses com.api.Tax; }"
      E: "module com.app { requires com.api; provides com.api.Tax; }"
    answer: [A, C]
    why: >-
      Consumer cần đọc module chứa interface (`requires com.api`) và khai báo `uses com.api.Tax`. Thêm `requires com.impl`
      (C) là thừa nhưng vẫn hợp lệ.
    wrong:
      B: "Thiếu `uses` → `ServiceLoader.load` ném `ServiceConfigurationError` lúc chạy (không in `rate=10`)."
      D: "Không `requires com.api` thì không nhìn thấy `com.api.Tax` → lỗi biên dịch."
      E: "`provides` phải có `with <lớp cài đặt>`; và consumer vẫn thiếu `uses`."

  - id: "M1-48"
    level: medium
    topic: "4.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Chain {
          static class AppEx extends Exception {
              AppEx(String m, Throwable c) { super(m, c); }
          }

          static void load() throws AppEx {
              try {
                  Integer.parseInt("x");
              } catch (NumberFormatException e) {
                  throw new AppEx("load failed", e);
              } finally {
                  System.out.print("F ");
              }
          }

          public static void main(String[] args) {
              try {
                  load();
              } catch (AppEx e) {
                  System.out.print(e.getMessage() + " <- " + e.getCause().getClass().getSimpleName());
              }
          }
      }
    expect: "F load failed <- NumberFormatException"
    options:
      A: "load failed <- NumberFormatException F"
      B: "F load failed <- NumberFormatException"
      C: "F load failed <- AppEx"
      D: "F For input string: \"x\" <- NumberFormatException"
    answer: B
    why: >-
      `finally` trong `load()` chạy trước khi exception rời method (in `F `). `main` bắt `AppEx`: message là `load failed`,
      cause là `NumberFormatException`.
    wrong:
      A: "`finally` của `load()` chạy trước khi `main` bắt exception."
      C: "`getCause()` là exception gốc được truyền vào constructor."
      D: "`getMessage()` của `AppEx` là chuỗi truyền vào: `load failed`."

  - id: "M1-49"
    level: medium
    topic: "10.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.time.LocalDateTime;
      import java.time.format.DateTimeFormatter;
      import java.util.Locale;

      public class Fmt {
          public static void main(String[] args) {
              LocalDateTime t = LocalDateTime.of(2024, 7, 4, 9, 5);
              System.out.println(t.format(DateTimeFormatter.ofPattern("EEE, MMM d yyyy 'at' h:mm a", Locale.US)));
          }
      }
    expect: "Thu, Jul 4 2024 at 9:05 AM"
    options:
      A: "Thu, Jul 04 2024 at 09:05 AM"
      B: "Thursday, July 4 2024 at 9:05 AM"
      C: "Thu, Jul 4 2024 'at' 9:05 AM"
      D: "Thu, Jul 4 2024 at 9:05 AM"
    answer: D
    why: >-
      `EEE` = thứ viết tắt, `MMM` = tháng viết tắt, `d`/`h` một chữ cái không thêm số 0, `mm` = phút 2 chữ số,
      `'at'` là văn bản nguyên văn (không in dấu nháy), `a` = AM/PM.
    wrong:
      A: "`d` và `h` (một chữ cái) không đệm số 0."
      B: "Tên đầy đủ cần `EEEE` và `MMMM`."
      C: "Dấu nháy đơn chỉ đánh dấu văn bản, không được in ra."

  - id: "M1-50"
    level: hard
    topic: "3.5, 5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Eq {
          record Pt(int x, int y) { }

          static class Pix {
              int x;
              Pix(int x) { this.x = x; }
              @Override public boolean equals(Object o) { return o instanceof Pix p && p.x == x; }
          }

          public static void main(String[] args) {
              Set<Object> set = new HashSet<>();
              set.add(new Pt(1, 2));
              set.add(new Pt(1, 2));
              set.add(new Pix(5));
              set.add(new Pix(5));
              System.out.println(set.size() + " " + new Pix(5).equals(new Pix(5)) + " " + new Pt(1, 2).equals(new Pt(1, 2)));
          }
      }
    expect: "3 true true"
    options: {A: "3 true true", B: "2 true true", C: "4 false true", D: "3 false true"}
    answer: A
    why: >-
      Record tự sinh `equals` **và** `hashCode` theo component → hai `Pt(1, 2)` là một phần tử. `Pix` override `equals`
      nhưng **không** override `hashCode` → hai object có hash khác nhau nên `HashSet` giữ cả hai (vi phạm hợp đồng
      equals/hashCode). Tổng 3; `equals` vẫn trả về `true`.
    wrong:
      B: "`HashSet` so sánh `hashCode` trước; `Pix` dùng `hashCode` mặc định (khác nhau) nên không bị coi là trùng."
      C: "Record có `equals`/`hashCode` theo giá trị → hai `Pt` trùng nhau."
      D: "`Pix.equals` được override và so sánh `x` → `true`."
