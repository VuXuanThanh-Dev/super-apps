    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Hier {
          sealed interface Vehicle permits Car, Bike, Truck { }
          record Car(int seats) implements Vehicle { }                // L1
          static final class Bike implements Vehicle { }             // L2
          static non-sealed class Truck implements Vehicle { }        // L3
          static class BigTruck extends Truck { }                     // L4
          record Boat() extends Car { }                               // L5
          static class Scooter extends Bike { }                       // L6

          public static void main(String[] args) { }
      }
    error_markers: [L5, L6]
    options: {A: L5 và L6, B: Chỉ L5, C: L4 và L6, D: "L3, L5 và L6", E: Chỉ L6}
    answer: A
    why: >-
      Record không được `extends` (ngầm `extends Record`) → L5. `Bike` là `final` nên không có lớp con → L6.
      L3 `non-sealed` mở lại hệ thống kế thừa, nên L4 hợp lệ.
    wrong:
      B: "L6 cũng lỗi: `Bike` là `final`."
      C: "`Truck` là `non-sealed`, nên kế thừa nó (L4) là hợp lệ."
      D: "`non-sealed` là modifier hợp lệ cho lớp con của sealed type."
      E: "L5 cũng lỗi: record không có mệnh đề `extends`."

