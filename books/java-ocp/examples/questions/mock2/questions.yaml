meta:
  intro: |
    **Thời gian: 120 phút · 50 câu · Đậu: ≥ 34 câu đúng (68%).** Làm như thi thật: không IDE, không tra cứu, bấm giờ.
    Câu "chọn N đáp án" chỉ tính điểm khi chọn đúng đủ N đáp án. Khi đề không nói gì khác, locale mặc định là `en_US`.
    Mọi câu hỏi đều tự viết và đã được biên dịch/chạy bằng JDK 21.0.10 để xác nhận đáp án (code: `examples/questions/mock2/`).
questions:
  - id: "M2-01"
    level: medium
    topic: "1.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Boxes {
          public static void main(String[] args) {
              Integer a = 127;
              Integer b = 127;
              Long c = 127L;
              System.out.println((a == b) + " " + a.equals(c) + " " + (a.intValue() == c) + " " + c.equals(127L));
          }
      }
    expect: "true false true true"
    options: {A: "true true true true", B: "true false true true", C: "true false false true", D: "false false true true"}
    answer: B
    why: >-
      127 nằm trong cache → `a == b` là `true`. `Integer.equals(Long)` là `false` (khác kiểu). `a.intValue() == c`: `c` được
      unboxing và so sánh số → `true`. `c.equals(127L)`: `127L` boxing thành `Long` → `true`.
    wrong:
      A: "`equals` của wrapper kiểm tra cả kiểu: `Integer` không bằng `Long`."
      C: "So sánh `int == Long` unboxing `Long` rồi so sánh giá trị → `true`."
      D: "127 thuộc khoảng cache -128..127."

  - id: "M2-02"
    level: medium
    topic: "2.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Grades {
          static int score(char g) {
              return switch (g) {
                  case 'A': case 'B':
                      yield 3;
                  case 'C':
                      System.out.print("C! ");
                  case 'D':
                      yield 1;
                  default:
                      yield 0;
              };
          }

          public static void main(String[] args) {
              System.out.println(score('B') + score('C') + score('X'));
          }
      }
    expect: "C! 4"
    options: {A: "4", B: "C! 3", C: "C! 5", D: "C! 4"}
    answer: D
    why: >-
      Switch **expression** dạng `:` vẫn có fall-through: `'C'` in `C! ` rồi rơi xuống `case 'D'` và `yield 1`. Tổng
      3 + 1 + 0 = 4. `C! ` được in trong lúc tính biểu thức, trước khi `println` in 4.
    wrong:
      A: "`score('C')` có in `C! ` trước khi `yield`."
      B: "`'C'` rơi xuống `case 'D'` và trả về 1, không phải 0."
      C: "`'X'` vào `default` → 0; tổng là 4."

  - id: "M2-03"
    level: hard
    topic: "3.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Temps {
          record Temp(double celsius) {
              Temp {
                  if (celsius < -273.15) celsius = -273.15;
              }
              public double celsius() { return Math.round(celsius * 10) / 10.0; }
          }

          public static void main(String[] args) {
              Temp a = new Temp(21.456), b = new Temp(21.4), c = new Temp(-300);
              System.out.println(a.celsius() + " " + a.equals(b) + " " + c + " "
                      + (a.hashCode() == new Temp(21.456).hashCode()));
          }
      }
    expect: "21.5 false Temp[celsius=-273.15] true"
    options:
      A: "21.5 false Temp[celsius=-273.15] true"
      B: "21.5 true Temp[celsius=-273.15] true"
      C: "21.456 false Temp[celsius=-300.0] true"
      D: "21.5 false Temp[celsius=-273.2] true"
    answer: A
    why: >-
      Compact constructor chuẩn hoá tham số trước khi gán field (-300 → -273.15). Accessor viết tay làm tròn khi **gọi**
      `celsius()` → 21.5, nhưng `equals`, `hashCode`, `toString` tự sinh dùng **giá trị field** (21.456 ≠ 21.4).
    wrong:
      B: "`equals` của record so sánh field (21.456 và 21.4), không gọi accessor viết tay."
      C: "Accessor làm tròn; và compact constructor đã đổi -300 thành -273.15."
      D: "`toString()` tự sinh dùng field, không dùng accessor đã làm tròn."

  - id: "M2-04"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Nav {
          public static void main(String[] args) {
              TreeMap<Integer, String> m = new TreeMap<>(Map.of(10, "ten", 20, "twenty", 30, "thirty", 40, "forty"));
              System.out.println(m.floorKey(25) + " " + m.ceilingEntry(25) + " " + m.headMap(30).keySet() + " "
                      + m.tailMap(30, false) + " " + m.descendingMap().firstKey());
          }
      }
    expect: "20 30=thirty [10, 20] {40=forty} 40"
    options:
      A: "20 30=thirty [10, 20, 30] {40=forty} 40"
      B: "30 20=twenty [10, 20] {30=thirty, 40=forty} 10"
      C: "20 30=thirty [10, 20] {40=forty} 40"
      D: "20 30=thirty [10, 20] {30=thirty, 40=forty} 40"
    answer: C
    why: >-
      `floorKey(25)` = key lớn nhất ≤ 25 → 20; `ceilingEntry(25)` = entry có key nhỏ nhất ≥ 25 → `30=thirty`.
      `headMap(30)` không gồm 30. `tailMap(30, false)` loại 30. `descendingMap()` đảo thứ tự → key đầu là 40.
    wrong:
      A: "`headMap(toKey)` mặc định loại trừ `toKey`."
      B: "`floor` ≤, `ceiling` ≥; và `descendingMap` bắt đầu từ key lớn nhất."
      D: "Tham số `false` của `tailMap` loại trừ key 30."

  - id: "M2-05"
    level: medium
    topic: "6.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Merge {
          public static void main(String[] args) {
              Map<Character, Integer> m = Stream.of("kiwi", "apple", "avocado", "kale", "banana")
                      .collect(Collectors.toMap(s -> s.charAt(0), String::length, Integer::sum, LinkedHashMap::new));
              System.out.println(m);
          }
      }
    expect: "{k=8, a=12, b=6}"
    options: {A: "{a=12, b=6, k=8}", B: "{k=8, a=12, b=6}", C: "{k=4, a=5, b=6}", D: "IllegalStateException: Duplicate key k"}
    answer: B
    why: >-
      Key trùng được gộp bằng `Integer::sum`: k → 4 + 4, a → 5 + 7. `LinkedHashMap` giữ thứ tự key được thêm lần đầu:
      k, a, b.
    wrong:
      A: "`LinkedHashMap` giữ thứ tự chèn, không sắp xếp."
      C: "Hàm merge cộng độ dài của các từ cùng chữ cái đầu."
      D: "Có hàm merge nên key trùng không gây exception."

  - id: "M2-06"
    level: hard
    topic: "3.3"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Amb {
          static void f(String s) { }
          static void f(StringBuilder sb) { }
          static void g(Object o) { }
          static void g(String s) { }
          static void h(int... a) { }
          static void h(long... a) { }

          public static void main(String[] args) {
              f(null);             // L1
              g(null);             // L2
              h();                 // L3
              h(1);                // L4
              f((String) null);    // L5
          }
      }
    error_markers: [L1]
    options: {A: L1 và L3, B: "L1, L3 và L4", C: Chỉ L2, D: Chỉ L1, E: Không dòng nào}
    answer: D
    why: >-
      `f(null)`: `String` và `StringBuilder` không có quan hệ kế thừa, không cái nào cụ thể hơn → ambiguous. `g(null)` chọn
      `String` (cụ thể hơn `Object`). `h()` và `h(1)`: `int...` cụ thể hơn `long...` (vì `int` nới rộng được thành `long`).
      L5 có cast nên rõ ràng.
    wrong:
      A: "`h()` không mơ hồ: `h(int...)` cụ thể hơn `h(long...)`."
      B: "L3 và L4 đều chọn `h(int...)`."
      C: "`String` là lớp con của `Object` nên `g(String)` được chọn."
      E: "L1 mơ hồ giữa `String` và `StringBuilder`."

  - id: "M2-07"
    level: hard
    topic: "1.3"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Block {
          public static void main(String[] args) {
              String t = """
                  ab\tc
                    d\
                  e
                  """;
              System.out.println(t.lines().count() + " " + t.length() + " "
                      + t.indent(2).lines().findFirst().get().length() + " " + "  x ".strip().length());
          }
      }
    expect: "2 10 6 1"
    options: {A: "2 10 6 1", B: "3 11 6 1", C: "2 12 6 1", D: "2 10 4 1"}
    answer: A
    why: >-
      Sau khi bỏ thụt lề chung: dòng 1 `ab<TAB>c` (4 ký tự), dòng 2 `  d` nối với `e` (do `\` cuối dòng) → `  de`
      (4 ký tự), cộng 2 ký tự xuống dòng → 10 ký tự, 2 dòng. `indent(2)` thêm 2 dấu cách mỗi dòng → dòng đầu dài 6.
      `strip()` còn `x`.
    wrong:
      B: "`\\` ở cuối dòng nối `d` với `e`, nên chỉ có 2 dòng."
      C: "`\\t` là **một** ký tự tab; và chỉ có 2 ký tự xuống dòng."
      D: "`indent(2)` thêm 2 dấu cách vào đầu dòng: 4 + 2 = 6."

  - id: "M2-08"
    level: medium
    topic: "4.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Ret {
          static int f() {
              int x = 1;
              try {
                  x = 2;
                  throw new RuntimeException("try");
              } catch (RuntimeException e) {
                  x = 3;
                  return x;
              } finally {
                  x = 4;
                  System.out.print("finally x=" + x + " ");
              }
          }

          public static void main(String[] args) {
              System.out.println("result=" + f());
          }
      }
    expect: "finally x=4 result=3"
    options: {A: "finally x=4 result=4", B: "result=3 finally x=4", C: "finally x=4 result=3", D: "finally x=3 result=3"}
    answer: C
    why: >-
      `return x` trong `catch` chốt giá trị 3. `finally` chạy trước khi method trả về: đổi biến thành 4 và in ra, nhưng giá
      trị trả về vẫn là 3.
    wrong:
      A: "Giá trị primitive đã chốt khi `return` không bị `finally` thay đổi."
      B: "`finally` chạy xong trước khi `f()` trả kết quả cho `println`."
      D: "`finally` in giá trị sau khi gán `x = 4`."

  - id: "M2-09"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.io.IOException;
      import java.util.concurrent.*;

      public class States {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newSingleThreadExecutor();
              Future<Integer> f = ex.submit(() -> {
                  if (true) throw new IOException("disk");
                  return 1;
              });
              try {
                  f.get();
              } catch (ExecutionException e) {
                  System.out.print(e.getCause() instanceof IOException ? "IO " : "other ");
              }
              System.out.print(f.isDone() + " " + f.isCancelled() + " " + f.state());
              ex.shutdown();
          }
      }
    expect: "IO true false FAILED"
    options: {A: "IO false false FAILED", B: "IO true false FAILED", C: "other true false FAILED", D: "IO true false SUCCESS"}
    answer: B
    why: >-
      Lambda có `return` giá trị và ném checked exception → là `Callable`. Exception được gói trong `ExecutionException`
      (cause là `IOException`). Task đã kết thúc (dù thất bại) nên `isDone()` là `true`; `Future.state()` (Java 19+) là `FAILED`.
    wrong:
      A: "`isDone()` là `true` cho cả trường hợp hoàn thành bình thường, lỗi hay bị huỷ."
      C: "`getCause()` là exception gốc `IOException`."
      D: "Task ném exception nên trạng thái là `FAILED`."

  - id: "M2-10"
    level: easy
    topic: "2.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Grid {
          public static void main(String[] args) {
              int[][] grid = {{1, 2}, {3, 4}, {5, 6}};
              int total = 0;
              for (var row : grid) {
                  for (var v : row) {
                      if (v == 4) break;
                      total += v;
                  }
              }
              System.out.println(total);
          }
      }
    expect: "17"
    options: {A: "6", B: "21", C: "11", D: "17"}
    answer: D
    why: >-
      `break` (không nhãn) chỉ thoát vòng **trong**. Hàng 1: 1 + 2; hàng 2: 3 rồi dừng ở 4; hàng 3: 5 + 6. Tổng 17.
    wrong:
      A: "`break` không thoát vòng ngoài; hàng 3 vẫn được cộng."
      B: "4 không được cộng (break trước khi cộng)."
      C: "Hàng 3 (5 + 6) vẫn được cộng: 3 + 3 + 11 = 17."

  - id: "M2-11"
    level: medium
    topic: "3.5"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      class P {
          String name = "P";
          String who() { return "P.who:" + name; }
      }

      class C extends P {
          String name = "C";
          String who() { return "C.who:" + name + "/" + super.name + "/" + super.who(); }
      }

      public class Hide {
          public static void main(String[] args) {
              P p = new C();
              System.out.println(p.who() + " | " + p.name);
          }
      }
    expect: "C.who:C/P/P.who:P | P"
    options:
      A: "C.who:C/P/P.who:P | P"
      B: "C.who:C/P/P.who:C | P"
      C: "C.who:C/P/P.who:P | C"
      D: "P.who:P | P"
    answer: A
    why: >-
      `p.who()` gọi bản override của `C`. Trong `C`, `name` là field của `C`, `super.name` là field của `P`. `super.who()`
      chạy code của `P`, nơi `name` là field của `P` (field không đa hình). `p.name` theo kiểu tham chiếu `P` → `P`.
    wrong:
      B: "Trong method của `P`, `name` luôn là field của `P`; field không bị override."
      C: "Truy cập field theo kiểu tham chiếu (`P`), không theo kiểu object."
      D: "`who()` được override nên gọi bản của `C`."

  - id: "M2-12"
    level: medium
    topic: "3.6"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Statics {
          interface Tool {
              static String id() { return "tool"; }
              default String name() { return id(); }
          }

          static class Hammer implements Tool { }

          public static void main(String[] args) {
              Hammer h = new Hammer();
              String a = Tool.id();          // L1
              String b = h.name();           // L2
              String c = Hammer.id();        // L3
              String d = h.id();             // L4
          }
      }
    error_markers: [L3, L4]
    options: {A: Chỉ L3, B: Chỉ L4, C: L3 và L4, D: "L2, L3 và L4", E: Không dòng nào}
    answer: C
    why: >-
      Method `static` của **interface** không được kế thừa sang lớp implements và không gọi được qua object; chỉ gọi bằng
      tên interface (`Tool.id()`). Default method `name()` gọi `id()` bên trong interface là hợp lệ.
    wrong:
      A: "`h.id()` cũng lỗi: static method của interface không gọi qua object."
      B: "`Hammer.id()` cũng lỗi: static method của interface không được kế thừa."
      D: "`h.name()` gọi default method → hợp lệ."
      E: "L3 và L4 lỗi."

  - id: "M2-13"
    level: medium
    topic: "1.4"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.time.*;

      public class Inst {
          public static void main(String[] args) {
              Instant start = Instant.parse("2024-02-28T22:00:00Z");
              Instant end = start.plus(Duration.ofHours(30));
              Duration d = Duration.between(start, end);
              System.out.println(end + " " + d + " " + d.toDaysPart() + " " + d.toHoursPart());
          }
      }
    expect: "2024-03-01T04:00:00Z PT30H 1 6"
    options:
      A: "2024-02-30T04:00:00Z PT30H 1 6"
      B: "2024-03-01T04:00:00Z PT30H 1 6"
      C: "2024-03-01T04:00:00Z P1DT6H 1 6"
      D: "2024-03-01T04:00:00Z PT30H 30 6"
    answer: B
    why: >-
      2024 là năm nhuận: 28/2 22:00 + 30 giờ = 29/2 22:00 + 6 giờ = 1/3 04:00 (UTC). `Duration.toString()` dùng giờ:
      `PT30H`. `toDaysPart()` = 1, `toHoursPart()` = phần giờ còn lại = 6.
    wrong:
      A: "Không có ngày 30/2; `Instant` luôn là ngày hợp lệ."
      C: "`Duration.toString()` không in phần ngày."
      D: "`toDaysPart()` là số ngày (1), không phải tổng số giờ."

  - id: "M2-14"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Sets {
          public static void main(String[] args) {
              Set<String> s = new LinkedHashSet<>(List.of("d", "a", "c", "b"));
              s.removeIf(x -> x.compareTo("b") < 0);
              Set<String> other = new TreeSet<>(List.of("c", "d", "e"));
              s.retainAll(other);
              s.add("a");
              System.out.println(s + " " + other);
          }
      }
    expect: "[d, c, a] [c, d, e]"
    options:
      A: "[a, c, d] [c, d, e]"
      B: "[d, c, b, a] [c, d, e]"
      C: "[c, d, a] [c, d, e]"
      D: "[d, c, a] [c, d, e]"
    answer: D
    why: >-
      `LinkedHashSet` giữ thứ tự chèn: [d, a, c, b]. `removeIf` xoá phần tử nhỏ hơn `b` → [d, c, b]. `retainAll` chỉ giữ
      phần tử có trong `other` → [d, c]. Thêm `a` vào cuối → [d, c, a].
    wrong:
      A: "`LinkedHashSet` không sắp xếp; `a` mới thêm nằm cuối."
      B: "`retainAll` loại `b` vì `other` không chứa `b`."
      C: "Thứ tự chèn ban đầu giữ `d` trước `c`."

  - id: "M2-15"
    level: medium
    topic: "6.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Barrier {
          public static void main(String[] args) {
              List<Integer> r = Stream.of(3, 1, 2)
                      .peek(x -> System.out.print("a" + x + " "))
                      .sorted()
                      .peek(x -> System.out.print("b" + x + " "))
                      .limit(2)
                      .toList();
              System.out.println(r);
          }
      }
    expect: "a3 a1 a2 b1 b2 [1, 2]"
    options:
      A: "a3 a1 a2 b1 b2 [1, 2]"
      B: "a3 b3 a1 b1 [3, 1]"
      C: "a3 a1 a2 b1 b2 b3 [1, 2]"
      D: "a1 a2 a3 b1 b2 [1, 2]"
    answer: A
    why: >-
      `sorted()` là thao tác **có trạng thái (stateful)**: phải nhận hết phần tử (a3, a1, a2) rồi mới đẩy ra theo thứ tự đã
      sắp xếp. `limit(2)` dừng sau 1 và 2 nên không có `b3`.
    wrong:
      B: "`sorted()` chặn lại cho tới khi nhận đủ phần tử; không có xử lý xen kẽ trước nó."
      C: "`limit(2)` ngắt sau 2 phần tử."
      D: "Peek đầu tiên thấy phần tử theo thứ tự nguồn (3, 1, 2)."

  - id: "M2-16"
    level: medium
    topic: "3.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Anon {
          interface Greeter { String greet(); }

          String name = "outer";

          Greeter make() {
              String name = "local";
              return new Greeter() {
                  String name = "anon";
                  public String greet() { return name + "," + this.name + "," + Anon.this.name; }
              };
          }

          public static void main(String[] args) {
              System.out.println(new Anon().make().greet());
          }
      }
    expect: "anon,anon,outer"
    options: {A: "local,anon,outer", B: "anon,local,outer", C: "anon,anon,outer", D: "local,local,outer"}
    answer: C
    why: >-
