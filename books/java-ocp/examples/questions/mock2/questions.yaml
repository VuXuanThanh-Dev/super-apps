  - id: "M2-26"
    level: medium
    topic: "8.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.concurrent.CountDownLatch;
      import java.util.concurrent.locks.ReentrantLock;

      public class Try {
          public static void main(String[] args) throws Exception {
              ReentrantLock lock = new ReentrantLock();
              CountDownLatch held = new CountDownLatch(1), release = new CountDownLatch(1);
              Thread t = new Thread(() -> {
                  lock.lock();
                  try {
                      held.countDown();
                      release.await();
                  } catch (InterruptedException e) {
                  } finally {
                      lock.unlock();
                  }
              });
              t.start();
              held.await();
              boolean first = lock.tryLock();
              release.countDown();
              t.join();
              boolean second = lock.tryLock();
              System.out.println(first + " " + second + " " + lock.isHeldByCurrentThread() + " " + lock.getHoldCount());
          }
      }
    expect: "false true true 1"
    options: {A: "true true true 2", B: "false false false 0", C: "false true false 1", D: "false true true 1"}
    answer: D
    why: >-
      Khi `main` gọi `tryLock()` lần đầu, thread `t` đang giữ khoá → trả về `false` ngay (không chờ). Sau khi `t` nhả khoá
      và kết thúc, `tryLock()` thành công; `main` giữ khoá một lần.
    wrong:
      A: "Lần đầu khoá đang bị `t` giữ nên `tryLock()` thất bại."
      B: "Lần thứ hai khoá đã rảnh nên `tryLock()` thành công."
      C: "Sau `tryLock()` thành công, khoá thuộc về `main`."

