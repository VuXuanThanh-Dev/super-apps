      `List<? super Integer>` nhận list của `Integer` hoặc lớp cha (`Number`, `Object`); `Double` không phải lớp cha của
      `Integer` → L4. Không thêm được phần tử (trừ `null`) vào `List<? extends Number>` → L5. L2: `List.of(1.5, 2)` là list
      của một kiểu con chung của `Number` → hợp lệ.
