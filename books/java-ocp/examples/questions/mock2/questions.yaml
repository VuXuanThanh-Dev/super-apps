      import java.io.*;

      public class Impl {
          interface Loader { String load() throws IOException; }

          static class A implements Loader { public String load() { return "a"; } }                                 // L1
          static class B implements Loader { public String load() throws FileNotFoundException { return "b"; } }    // L2
          static class C implements Loader { public String load() throws Exception { return "c"; } }                // L3
          static class D implements Loader { String load() { return "d"; } }                                        // L4

          public static void main(String[] args) { new A().load(); }                                                 // L5
      }
    error_markers: [L3, L4]
    options: {A: L3 và L4, B: Chỉ L3, C: "L3, L4 và L5", D: L4 và L5, E: L2 và L3}
    answer: A
    why: >-
      L3 ném checked exception rộng hơn (`Exception`) → lỗi. L4: method của interface ngầm `public`, cài đặt package-private
      là giảm quyền → lỗi. L5 hợp lệ vì gọi qua kiểu `A`, mà `A.load()` không khai báo `throws`.
    wrong:
      B: "L4 cũng lỗi (giảm quyền truy cập)."
      C: "Kiểu tĩnh là `A`, không phải `Loader`, nên không phải xử lý `IOException` ở L5."
      D: "L5 hợp lệ; L3 lỗi."
      E: "L2 hợp lệ: ném exception hẹp hơn là được."

