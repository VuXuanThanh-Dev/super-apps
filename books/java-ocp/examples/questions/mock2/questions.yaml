      A: "[10, 99, 30] 139 true false"
      B: "[99, 10, 30] 139 true true"
      C: "[10, 99, 30] 139 true true"
      D: "[10, 20, 99, 30] 159 true true"
    answer: C
    why: >-
      Xoá giá trị 20 → [10, 30]; chèn 99 ở chỉ số 1 → [10, 99, 30], tổng 139. `equals` so sánh giá trị. `big1 == 1000`:
      một vế là primitive nên `big1` được unboxing → so sánh số → `true`.
    wrong:
      A: "So sánh `Integer == int` unboxing và so sánh giá trị, không so sánh tham chiếu."
      B: "`add(1, 99)` chèn ở chỉ số 1, sau 10."
      D: "`remove(Integer.valueOf(20))` đã xoá 20."

  - id: "M2-49"
    level: medium
    topic: "7.1"
    q: >-
      Lớp provider dưới đây không có constructor public không tham số và cũng không có method `public static provider()`.
      Điều gì xảy ra khi biên dịch các module?
    kind: script
    files:
      src/com.api/module-info.java: "module com.api { exports com.api; }"
      src/com.api/com/api/Codec.java: |
        package com.api;
        public interface Codec { String name(); }
      src/com.impl/module-info.java: |
        module com.impl {
            requires com.api;
            provides com.api.Codec with com.impl.Gzip;
        }
      src/com.impl/com/impl/Gzip.java: |
        package com.impl;
        public class Gzip implements com.api.Codec {
            private final int level;
            public Gzip(int level) { this.level = level; }
            public String name() { return "gzip" + level; }
        }
    run: |
      javac -d out --module-source-path src -m com.api,com.impl 2>&1 | grep -o "does not have a default constructor" | head -1
    expect: "does not have a default constructor"
    opt_style: text
    options:
      A: "Biên dịch thành công; `ServiceLoader` tạo provider bằng `Gzip(0)`"
      B: "Biên dịch thành công nhưng lúc chạy `ServiceLoader` bỏ qua provider này"
      C: "Lỗi biên dịch: lớp cài đặt service không có constructor mặc định (public, không tham số)"
      D: "Biên dịch thành công nhưng ném `ServiceConfigurationError` khi module được nạp"
    answer: C
    why: >-
      Với module, javac kiểm tra ngay directive `provides ... with`: lớp cài đặt phải có constructor `public` không tham số,
      **hoặc** một method `public static provider()`. Không có → lỗi biên dịch "the service implementation does not have a
      default constructor".
    wrong:
      A: "`ServiceLoader` không tự đoán tham số constructor."
      B: "Lỗi được phát hiện ngay lúc biên dịch module."
      D: "Không tới được bước chạy vì biên dịch thất bại."

  - id: "M2-50"
    level: medium
    topic: "6.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Words {
          public static void main(String[] args) {
              List<String> words = List.of("sun", "sea", "sky", "moon", "mars", "star");
              Map<Character, String> m = words.stream().collect(Collectors.groupingBy(w -> w.charAt(0), TreeMap::new,
                      Collectors.mapping(String::toUpperCase, Collectors.joining("/"))));
              Map<Integer, Long> byLen = words.stream().collect(
                      Collectors.groupingBy(String::length, TreeMap::new, Collectors.counting()));
              System.out.println(m + " " + byLen);
          }
      }
    expect: "{m=MOON/MARS, s=SUN/SEA/SKY/STAR} {3=3, 4=3}"
    options:
      A: "{s=SUN/SEA/SKY/STAR, m=MOON/MARS} {3=3, 4=3}"
      B: "{m=MOON/MARS, s=SUN/SEA/SKY/STAR} {3=3, 4=3}"
      C: "{m=MOON/MARS, s=SUN/SEA/SKY/STAR} {3=4, 4=2}"
      D: "{m=[MOON, MARS], s=[SUN, SEA, SKY, STAR]} {3=3, 4=3}"
    answer: B
    why: >-
      `TreeMap` sắp xếp key (`m` < `s`). `mapping` đổi sang chữ hoa rồi `joining("/")` theo thứ tự gặp. Độ dài 3: sun, sea,
      sky; độ dài 4: moon, mars, star.
    wrong:
      A: "`TreeMap` sắp xếp key: `m` trước `s`."
      C: "`star` có 4 ký tự: mỗi nhóm độ dài có 3 từ."
      D: "Collector phụ là `joining`, tạo chuỗi, không phải list."
