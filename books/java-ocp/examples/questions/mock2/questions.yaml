      B: "{true=125.0, false=125.0} 4@62.5"
      C: "{false=125.0, true=125.0} 4@250.0"
      D: "{false=2, true=2} 4@62.5"
    answer: A
    why: >-
      `partitioningBy` + `summingDouble`: đã trả (100 + 25) và chưa trả (50 + 75) đều 125.0; map in `false` trước.
      `teeing` chạy hai collector (đếm = 4, trung bình = 62.5) rồi gộp kết quả.
    wrong:
      B: "Map của `partitioningBy` in khoá `false` trước."
      C: "`averagingDouble` tính trung bình, không phải tổng."
      D: "Collector phụ là `summingDouble`, không phải `counting`."

