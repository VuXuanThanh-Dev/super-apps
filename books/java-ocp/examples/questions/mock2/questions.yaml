      import java.util.*;

      public class Wrap {
          public static void main(String[] args) {
              List<Integer> l = new ArrayList<>(List.of(10, 20, 30));
              l.remove(Integer.valueOf(20));
              l.add(1, 99);
              int sum = 0;
              for (int x : l) sum += x;
