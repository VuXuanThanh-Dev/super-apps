  - id: "M2-44"
    level: hard
    topic: "6.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Api {
          public static void main(String[] args) {
              List<String> l = List.of("a", "bb");
              int a = l.stream().mapToInt(String::length).sum();                  // L1
              double b = l.stream().mapToInt(String::length).average();           // L2
              long c = l.stream().count();                                        // L3
              int d = l.stream().map(String::length).max(Integer::compare);       // L4
              Optional<String> e = l.stream().findFirst();                        // L5
          }
      }
    error_markers: [L2, L4]
    options: {A: Chỉ L2, B: Chỉ L4, C: "L2, L4 và L5", D: L2 và L4, E: L3 và L4}
    answer: D
    why: >-
      `average()` trả về `OptionalDouble` (không phải `double`) → L2. `max(Comparator)` trên `Stream<Integer>` trả về
      `Optional<Integer>` (không phải `int`) → L4. `sum()` của `IntStream` là `int`; `count()` là `long`; `findFirst()` là `Optional`.
    wrong:
      A: "L4 cũng lỗi: `max` trả về `Optional<Integer>`."
      B: "L2 cũng lỗi: `average()` trả về `OptionalDouble`."
      C: "L5 hợp lệ."
      E: "`count()` trả về `long` → L3 hợp lệ."

  - id: "M2-45"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Stop {
          public static void main(String[] args) throws InterruptedException {
              Thread t = new Thread(() -> {
                  while (!Thread.currentThread().isInterrupted()) {
                      Thread.onSpinWait();
                  }
                  System.out.print("stopped ");
              });
              t.start();
              t.interrupt();
              t.join();
              System.out.println(t.getState());
          }
      }
    expect: "stopped TERMINATED"
    opt_style: text
    options:
      A: "`stopped TERMINATED`"
      B: "`TERMINATED`"
      C: "Chương trình chạy mãi không dừng"
      D: "`stopped RUNNABLE`"
    answer: A
    why: >-
      `interrupt()` chỉ đặt cờ interrupt; thread đang chạy tự kiểm tra cờ bằng `isInterrupted()` rồi thoát vòng lặp, in
      `stopped `. `join()` đợi nó kết thúc → trạng thái `TERMINATED`.
    wrong:
      B: "Thread thoát vòng lặp và in `stopped ` trước khi kết thúc."
      C: "Cờ interrupt được đặt nên điều kiện vòng lặp sẽ sai."
      D: "`join()` đợi tới khi thread kết thúc."

  - id: "M2-46"
    level: medium
    topic: "9.1"
    q: File nguồn lưu bằng UTF-8. Chương trình sau in ra gì?
    kind: output
    code: |
      import java.io.*;
      import java.nio.charset.StandardCharsets;
      import java.nio.file.*;

      public class Count {
          public static void main(String[] args) throws IOException {
              Files.writeString(Path.of("u.txt"), "hé");
              try (InputStream in = new FileInputStream("u.txt");
                   Reader r = new FileReader("u.txt", StandardCharsets.UTF_8)) {
                  int bytes = 0, chars = 0;
                  while (in.read() != -1) bytes++;
                  while (r.read() != -1) chars++;
                  System.out.println(bytes + " " + chars);
              }
          }
      }
    expect: "3 2"
    options: {A: "2 2", B: "3 3", C: "2 3", D: "3 2"}
    answer: D
    why: >-
      Byte stream đọc từng **byte**: `h` (1) + `é` (2 byte trong UTF-8) = 3. Character stream đọc từng **ký tự**: 2.
    wrong:
      A: "`é` chiếm 2 byte trong UTF-8."
      B: "`Reader` giải mã UTF-8 thành 2 ký tự."
      C: "Ngược lại: số byte nhiều hơn số ký tự."

  - id: "M2-47"
    level: medium
    topic: "3.3"
    q: Khai báo method nào, chèn vào chỗ `// INSERT CODE HERE`, biên dịch được?
    kind: variants
    criterion: compiles
    template: |
      public class Varargs {
          /*INSERT*/

          public static void main(String[] args) { }
      }
    options:
      A: "static void m(int... a, String s) { }"
      B: "static void m(String s, int... a) { }"
      C: "static void m(int... a, int... b) { }"
      D: "static void m(int[]... a) { }"
      E: "static void m(int a...) { }"
    answer: [B, D]
    why: >-
      Varargs phải là tham số **cuối cùng** và chỉ có một (B). `int[]...` là varargs của mảng `int` (D).
    wrong:
      A: "Varargs phải đứng cuối danh sách tham số."
      C: "Chỉ được có một tham số varargs."
      E: "Dấu `...` đặt sau kiểu, không phải sau tên."

