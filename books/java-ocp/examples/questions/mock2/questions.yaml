  - id: "M2-36"
    level: hard
    topic: "8.3"
    q: Hai phát biểu nào đúng về parallel stream?
    kind: proofs
    options:
      A: "`forEachOrdered` trên parallel stream của một `List` xử lý phần tử theo thứ tự của list."
      B: "`collect(Collectors.toList())` trên parallel stream của `List` trả về list theo thứ tự ngẫu nhiên."
      C: "`isParallel()` trả về `false` sau khi gọi `.parallel().sequential()`."
      D: "`reduce(0, (a, b) -> a - b)` trên parallel stream luôn cho cùng kết quả với tuần tự."
      E: "Gọi `parallelStream()` trên list tạo bởi `List.of(...)` ném `UnsupportedOperationException`."
    proofs:
      A:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              StringBuilder sb = new StringBuilder();
              List.of(1, 2, 3, 4, 5, 6, 7, 8).parallelStream().forEachOrdered(sb::append);
              System.out.println(sb); } }
        expect: "12345678"
      B:
        holds: false
        code: |
          import java.util.*;
          import java.util.stream.*;
          public class P { public static void main(String[] a) {
              List<Integer> src = IntStream.range(0, 1000).boxed().toList();
              System.out.println(src.parallelStream().collect(Collectors.toList()).equals(src)); } }
        expect: "true"
      C:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              System.out.println(List.of(1).stream().parallel().sequential().isParallel()); } }
        expect: "false"
      D:
        holds: false
        code: |
          import java.util.stream.*;
          public class P { public static void main(String[] a) {
              int seq = IntStream.rangeClosed(1, 8).reduce(0, (x, y) -> x - y);
              int par = IntStream.rangeClosed(1, 8).parallel().reduce(0, (x, y) -> x - y);
              System.out.println(seq == par ? "same" : "different"); } }
        expect: "different"
      E:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              System.out.println(List.of(1, 2, 3).parallelStream().mapToInt(i -> i).sum()); } }
        expect: "6"
    answer: [A, C]
    why: >-
      A: `forEachOrdered` tôn trọng thứ tự gặp của nguồn có thứ tự. C: lời gọi `parallel()`/`sequential()` cuối cùng quyết
      định chế độ của cả pipeline.
    wrong:
      B: "Với nguồn có thứ tự, `collect(toList())` giữ thứ tự gặp, kể cả song song."
      D: "Phép trừ không kết hợp; kết quả song song phụ thuộc cách chia (trên máy kiểm tra: khác tuần tự)."
      E: "Tạo stream chỉ đọc dữ liệu, không sửa list, nên list bất biến vẫn dùng được."

