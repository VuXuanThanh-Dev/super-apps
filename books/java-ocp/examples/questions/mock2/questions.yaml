    answer: D
    why: >-
      Quy tắc "**lớp thắng**" (class wins): method kế thừa từ lớp cha (`Base.greet`) được ưu tiên hơn default method của
      interface, nên không có xung đột. `Robot` override và gọi bản default qua `Named.super.greet()`.
    wrong:
