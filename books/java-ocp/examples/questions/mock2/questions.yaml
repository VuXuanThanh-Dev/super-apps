  - id: "M2-21"
    level: hard
    topic: "4.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Res {
          static class R implements AutoCloseable { public void close() { } }

          public static void main(String[] args) throws Exception {
              R a = new R();
              try (a) { }                                 // L1
              R b = new R();
              b = new R();
              try (b) { }                                 // L2
              try (R c = new R()) { c = new R(); }        // L3
              final R d = new R();
              try (d; R e = new R()) { }                  // L4
          }
      }
    error_markers: [L2, L3]
    options: {A: Chỉ L2, B: L2 và L3, C: L1 và L2, D: "L2, L3 và L4", E: Chỉ L3}
    answer: B
    why: >-
      Dạng `try (biến)` (Java 9+) cần biến final hoặc effectively final: `b` bị gán lại → L2 lỗi. Biến khai báo trong
      try-with-resources ngầm `final` → gán lại `c` là lỗi (L3). L1 và L4 hợp lệ (có thể trộn biến có sẵn và khai báo mới).
    wrong:
      A: "L3 cũng lỗi: biến tài nguyên ngầm final."
      C: "`a` effectively final nên L1 hợp lệ."
      D: "L4 hợp lệ: `d` là final, `e` khai báo mới."
      E: "L2 cũng lỗi vì `b` bị gán lại."

