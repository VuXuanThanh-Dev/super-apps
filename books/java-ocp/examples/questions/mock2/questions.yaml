    q: Kết quả của chương trình là gì?
    kind: output
    code: |
      public class Casts {
          interface Swimmer { }
          static class Fish implements Swimmer { }
          static class Dog { }

          public static void main(String[] args) {
              Fish f = new Fish();
              Swimmer s1 = f;
              Dog d = null;
              Swimmer s2 = (Swimmer) d;
              System.out.print((s2 == null) + " ");
              Swimmer s3 = (Swimmer) new Dog();
              System.out.print("done");
          }
      }
    expect: "true"
    expect_exception: ClassCastException
    opt_style: text
    options:
      A: "In ra `true` rồi ném `ClassCastException`"
      B: "Không biên dịch được ở dòng `(Swimmer) new Dog()`"
      C: "In ra `true done`"
      D: "Ném `NullPointerException` ở dòng `(Swimmer) d`"
    answer: A
    why: >-
      Cast `null` sang bất kỳ kiểu tham chiếu nào đều thành công. Cast một lớp **không final** sang interface biên dịch được
      (một lớp con của `Dog` có thể implements `Swimmer`), nhưng object thật là `Dog` → `ClassCastException` lúc chạy.
    wrong:
      B: "Compiler chỉ cấm khi lớp nguồn là `final` và không implements interface."
      C: "Object `Dog` không implements `Swimmer` → cast thất bại lúc chạy."
      D: "Cast giá trị `null` luôn thành công, không có NPE."

