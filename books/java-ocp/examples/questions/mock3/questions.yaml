  - id: "M3-50"
    level: hard
    topic: "2.1, 3.7"
    q: Kết quả của chương trình là gì?
    kind: output
    code: |
      public class Cmds {
          sealed interface Cmd permits Move, Stop { }
          enum Move implements Cmd { LEFT, RIGHT }
          record Stop() implements Cmd { }

          static String run(Cmd c) {
              return switch (c) {
                  case Move.LEFT -> "L";
                  case Move.RIGHT -> "R";
                  case Stop s -> "S";
              };
          }

          public static void main(String[] args) {
              System.out.println(run(Move.RIGHT) + run(new Stop()) + run(Move.LEFT));
          }
      }
    expect: "RSL"
    opt_style: text
    options:
      A: "Không biên dịch được: switch thiếu `default`"
      B: "Không biên dịch được: nhãn case của enum phải là tên không đầy đủ"
      C: "In ra `LSR`"
      D: "In ra `RSL`"
    answer: D
    why: >-
      Java 21 cho phép dùng **tên đầy đủ** của hằng enum (`Move.LEFT`) làm nhãn case khi selector có kiểu khác enum (ở đây
      là sealed interface `Cmd`). Hai hằng của `Move` và lớp `Stop` phủ hết các kiểu được permit → switch đầy đủ.
    wrong:
      A: "Mọi khả năng của `Cmd` đều được phủ, không cần `default`."
      B: "Từ Java 21, nhãn enum có thể viết đầy đủ `Move.LEFT`."
      C: "Thứ tự in theo thứ tự gọi: RIGHT, Stop, LEFT."
