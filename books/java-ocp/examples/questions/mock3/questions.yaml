    answer: B
    why: >-
      `len.andThen(f)` = áp dụng `len` rồi `f`. "java" dài 4 > 3 → `long`; "go" → `short`; "abcde" dài 5 → nhị phân `101`.
    wrong:
      A: "4 > 3 nên \"java\" là `long`."
      C: "`Integer::toBinaryString` đổi 5 thành chuỗi nhị phân."
