  - id: "M3-24"
    level: hard
    topic: "8.2"
    q: Hai phát biểu nào đúng?
    kind: proofs
    options:
      A: "Một thread có thể vào lại khối `synchronized` trên cùng object mà nó đang giữ khoá."
      B: "Method `static synchronized` và method instance `synchronized` của cùng một lớp dùng chung một khoá."
      C: "Gọi `wait()` bên ngoài khối `synchronized` trên object đó ném `IllegalMonitorStateException`."
      D: "`ReentrantLock.lock()` ném exception nếu khoá đang bị thread khác giữ."
      E: "`AtomicInteger.compareAndSet(expect, update)` luôn đặt giá trị mới."
    proofs:
      A:
        holds: true
        code: |
          public class P {
              static final Object LOCK = new Object();
              public static void main(String[] a) {
                  synchronized (LOCK) { synchronized (LOCK) { System.out.println("re-entered"); } }
              }
          }
        expect: "re-entered"
      B:
        holds: false
        code: |
          import java.util.concurrent.CountDownLatch;
          public class P {
              static final CountDownLatch inside = new CountDownLatch(1), done = new CountDownLatch(1);
              synchronized void inst() throws InterruptedException { inside.countDown(); done.await(); }
              static synchronized void stat() { System.out.println("static entered while instance lock held"); }
              public static void main(String[] a) throws Exception {
                  P p = new P();
                  Thread t = new Thread(() -> { try { p.inst(); } catch (InterruptedException e) { } });
                  t.start();
                  inside.await();
                  stat();
                  done.countDown();
                  t.join();
              }
          }
        expect: "static entered while instance lock held"
      C:
        holds: true
        code: |
          public class P { public static void main(String[] a) throws Exception { new Object().wait(); } }
        expect_exception: IllegalMonitorStateException
      D:
        holds: false
        code: |
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.locks.ReentrantLock;
          public class P { public static void main(String[] a) throws Exception {
              ReentrantLock lock = new ReentrantLock();
              CountDownLatch held = new CountDownLatch(1);
              Thread t = new Thread(() -> { lock.lock(); held.countDown();
                  try { Thread.sleep(100); } catch (InterruptedException e) { } finally { lock.unlock(); } });
              t.start();
              held.await();
              lock.lock();
              System.out.println("acquired after waiting");
              lock.unlock(); } }
        expect: "acquired after waiting"
      E:
        holds: false
        code: |
          import java.util.concurrent.atomic.AtomicInteger;
          public class P { public static void main(String[] a) {
              AtomicInteger x = new AtomicInteger(5);
              System.out.println(x.compareAndSet(4, 9) + " " + x.get()); } }
        expect: "false 5"
    answer: [A, C]
    why: >-
      A: khoá nội tại (intrinsic lock) là reentrant. C: `wait()`/`notify()` đòi thread phải đang giữ monitor của object.
    wrong:
      B: "`static synchronized` khoá trên object `Class`, còn method instance khoá trên `this` — hai khoá khác nhau."
      D: "`lock()` **chờ** cho tới khi lấy được khoá; `tryLock()` mới trả về ngay."
      E: "`compareAndSet` chỉ đặt khi giá trị hiện tại bằng giá trị mong đợi; nếu không thì trả `false` và giữ nguyên."

