              String c = a + "va";
              String d = b + "va";
              String e = "Java";
              System.out.println((c == e) + " " + (d == e) + " " + (d.intern() == e) + " " + c.equals(d));
          }
      }
    expect: "true false true true"
    options: {A: "true false true true", B: "false false true true", C: "true true true true", D: "true false false true"}
    answer: A
    why: >-
      `a` là biến `final` gán bằng hằng số → **constant variable**, nên `a + "va"` là hằng số compile-time, dùng chung object
      trong string pool với `"Java"`. `b` không final → `d` tạo lúc chạy (object mới). `intern()` trả về bản trong pool.
    wrong:
      B: "`final String a = \"Ja\"` biến `a + \"va\"` thành hằng số compile-time."
      C: "`b` không phải final, nên `b + \"va\"` là object mới."
      D: "`intern()` trả về đúng object trong pool (`e`)."

  - id: "M3-46"
    level: medium
    topic: "5.1"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      import java.util.*;

      public class Conv {
          public static void main(String[] args) {
              List<String> list = new ArrayList<>(List.of("a"));
              String[] a1 = list.toArray(new String[0]);        // L1
              String[] a2 = list.toArray();                     // L2
              Object[] a3 = list.toArray();                     // L3
              String[] a4 = list.toArray(String[]::new);        // L4
              List<String> l2 = Arrays.asList(a1);              // L5
              int[] ints = {1, 2};
              List<Integer> l3 = Arrays.asList(ints);           // L6
          }
      }
    error_markers: [L2, L6]
    options: {A: Chỉ L2, B: L2 và L4, C: Chỉ L6, D: L2 và L6, E: "L2, L4 và L6"}
    answer: D
    why: >-
      `toArray()` không tham số trả về `Object[]` → không gán cho `String[]` (L2). `Arrays.asList(int[])` tạo
      `List<int[]>` (mảng primitive là **một** phần tử), không phải `List<Integer>` (L6). L4 dùng `toArray(IntFunction)`
      (Java 11+) → hợp lệ.
    wrong:
      A: "L6 cũng lỗi: `int[]` không được boxing thành `Integer...`."
      B: "`toArray(String[]::new)` hợp lệ từ Java 11."
      C: "L2 cũng lỗi: `Object[]` không gán được cho `String[]`."
      E: "L4 hợp lệ."

  - id: "M3-47"
    level: medium
    topic: "6.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.stream.*;

      public class Opts {
          public static void main(String[] args) {
              List<Optional<String>> opts = List.of(Optional.of("a"), Optional.empty(), Optional.of("c"));
              String r = opts.stream().flatMap(Optional::stream).collect(Collectors.joining("+"));
              long empties = opts.stream().filter(Optional::isEmpty).count();
              System.out.println(r + " " + empties + " " + opts.get(1).map(String::length).orElse(-1));
          }
      }
    expect: "a+c 1 -1"
    options: {A: "a++c 1 -1", B: "a+c 1 0", C: "a+c 1 -1", D: "a+Optional.empty+c 1 -1"}
    answer: C
    why: >-
      `Optional.stream()` (Java 9+) trả về stream 0 hoặc 1 phần tử, nên `flatMap(Optional::stream)` bỏ các Optional rỗng.
      Có 1 Optional rỗng. `map` trên Optional rỗng vẫn rỗng → `orElse(-1)`.
    wrong:
      A: "Optional rỗng biến mất hoàn toàn, không để lại phần tử rỗng."
      B: "`map` trên Optional rỗng không gọi hàm; kết quả lấy từ `orElse(-1)`."
      D: "`flatMap(Optional::stream)` lấy giá trị bên trong, không in Optional."

  - id: "M3-48"
    level: hard
    topic: "3.4"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Leak {
          static final class Schedule {
              private final int[] days;
              Schedule(int[] days) { this.days = days; }
              int[] days() { return days.clone(); }
              int first() { return days[0]; }
          }

          public static void main(String[] args) {
              int[] input = {1, 2, 3};
              Schedule s = new Schedule(input);
              s.days()[0] = 99;
              input[1] = 42;
              System.out.println(s.first() + " " + s.days()[1]);
          }
      }
    expect: "1 42"
    options: {A: "99 42", B: "1 42", C: "1 2", D: "99 2"}
    answer: B
    why: >-
      Getter trả về bản **clone** nên sửa kết quả của `days()` không ảnh hưởng object (`first()` vẫn 1). Nhưng constructor
      **không** copy mảng nhận vào, nên sửa `input` sau đó làm thay đổi trạng thái bên trong (`days[1]` = 42). Lớp chưa
      thật sự bất biến.
    wrong:
      A: "`days()` trả về bản sao; sửa bản sao không đổi mảng bên trong."
      C: "Constructor lưu thẳng tham chiếu `input`, nên thấy thay đổi `input[1] = 42`."
      D: "Như A và C."

  - id: "M3-49"
