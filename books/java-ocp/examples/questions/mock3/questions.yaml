meta:
  intro: |
    **Thời gian: 120 phút · 50 câu · Đậu: ≥ 34 câu đúng (68%).** Làm như thi thật: không IDE, không tra cứu, bấm giờ.
    Câu "chọn N đáp án" chỉ tính điểm khi chọn đúng đủ N đáp án. Khi đề không nói gì khác, locale mặc định là `en_US`.
    Mọi câu hỏi đều tự viết và đã được biên dịch/chạy bằng JDK 21.0.10 để xác nhận đáp án (code: `examples/questions/mock3/`).
questions:
  - id: "M3-01"
    level: medium
    topic: "6.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.stream.*;

      public class Powers {
          public static void main(String[] args) {
              String s = IntStream.iterate(1, i -> i * 3).takeWhile(i -> i < 100)
                      .mapToObj(Integer::toString).collect(Collectors.joining(","));
              System.out.println(s + " " + IntStream.of(4, 8, 2).map(i -> i / 2).max().getAsInt());
          }
      }
    expect: "1,3,9,27,81 4"
    options: {A: "1,3,9,27 4", B: "1,3,9,27,81,243 4", C: "1,3,9,27,81 4", D: "1,3,9,27,81 8"}
    answer: C
    why: >-
      `iterate` tạo dãy vô hạn 1, 3, 9, 27, 81, 243…; `takeWhile(i < 100)` dừng ở 243. `map(i / 2)` → 2, 4, 1; `max()` trả
      về `OptionalInt`, `getAsInt()` = 4.
    wrong:
      A: "81 < 100 nên vẫn được lấy."
      B: "243 không thoả `i < 100`, `takeWhile` dừng tại đó."
      D: "`max()` áp dụng sau `map(i -> i / 2)`."

  - id: "M3-02"
    level: easy
    topic: "1.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Chars {
          public static void main(String[] args) {
              char c = 'x';
              int i = c;
              System.out.println(i + " " + Character.isLetter(c) + " " + Character.getNumericValue('7') + " "
                      + Integer.toBinaryString(5) + " " + Integer.parseInt("-0012"));
          }
      }
    expect: "120 true 7 101 -12"
    options: {A: "120 true 7 101 -12", B: "x true 7 101 -12", C: "120 true 55 101 -12", D: "120 true 7 5 -12"}
    answer: A
    why: >-
      Gán `char` cho `int` là widening → mã 120. `getNumericValue('7')` = 7 (giá trị số, không phải mã ký tự 55).
      `toBinaryString(5)` = `101`. `parseInt` chấp nhận dấu và số 0 ở đầu → -12.
    wrong:
      B: "`i` là `int` nên in số 120."
      C: "`getNumericValue` trả về giá trị chữ số, không phải mã Unicode."
      D: "`toBinaryString` trả về chuỗi nhị phân."

  - id: "M3-03"
    level: medium
    topic: "3.2"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Ctx {
          int count;
          static int total;

          static void s() { total++; }
          void i() { count++; total++; s(); }                    // L1
          static void t() { count++; }                           // L2
          static void u() { i(); }                               // L3
          static void v() { new Ctx().i(); this.total = 1; }     // L4

          public static void main(String[] args) { s(); }        // L5
      }
    error_markers: [L2, L3, L4]
    options: {A: Chỉ L2, B: L2 và L3, C: L3 và L4, D: "L2, L3 và L4", E: Chỉ L4}
    answer: D
    why: >-
      Trong ngữ cảnh static không có `this`: không truy cập field instance (L2), không gọi method instance trực tiếp (L3),
      không dùng `this` (L4). Method instance thì dùng được cả thành viên static (L1).
    wrong:
      A: "L3 và L4 cũng dùng thành viên instance/`this` trong method static."
      B: "L4 dùng `this` trong method static → lỗi."
      C: "L2 truy cập field instance `count` từ method static → lỗi."
      E: "L2 và L3 cũng lỗi."

  - id: "M3-04"
    level: medium
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class Ends {
          public static void main(String[] args) {
              Deque<Integer> d = new ArrayDeque<>();
              for (int i = 1; i <= 4; i++) {
                  if (i % 2 == 0) d.addFirst(i); else d.addLast(i);
              }
              StringBuilder sb = new StringBuilder();
              d.descendingIterator().forEachRemaining(sb::append);
              System.out.println(d + " " + sb + " " + d.removeLast() + " " + d.peekFirst());
          }
      }
    expect: "[4, 2, 1, 3] 3124 3 4"
    options:
      A: "[1, 2, 3, 4] 4321 4 1"
      B: "[4, 2, 1, 3] 3124 3 4"
      C: "[4, 2, 1, 3] 4213 3 4"
      D: "[4, 2, 1, 3] 3124 4 2"
    answer: B
    why: >-
      1 → cuối [1]; 2 → đầu [2, 1]; 3 → cuối [2, 1, 3]; 4 → đầu [4, 2, 1, 3]. `descendingIterator` duyệt từ cuối: 3124.
      `removeLast()` → 3; `peekFirst()` → 4.
    wrong:
      A: "Số chẵn được thêm vào **đầu** deque."
      C: "`descendingIterator` duyệt từ cuối về đầu."
      D: "`removeLast()` lấy phần tử cuối (3); phần tử đầu vẫn là 4."

  - id: "M3-05"
    level: medium
    topic: "2.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Converge {
          public static void main(String[] args) {
              int i = 0, j = 10, steps = 0;
              while (i++ < j--) {
                  if (i == j) continue;
                  steps++;
              }
              System.out.println(i + " " + j + " " + steps);
          }
      }
    expect: "6 4 4"
    options: {A: "5 5 4", B: "6 4 5", C: "6 4 4", D: "5 5 5"}
    answer: C
    why: >-
      Mỗi lần kiểm tra điều kiện, cả `i` và `j` đều thay đổi (kể cả lần cuối, khi điều kiện sai). Các lần vào vòng:
      (1,9), (2,8), (3,7), (4,6) → đếm 4; (5,5) → `continue`. Lần kiểm tra `5 < 5` sai nhưng vẫn làm i = 6, j = 4.
    wrong:
      A: "Lần kiểm tra cuối (sai) vẫn chạy `i++` và `j--`."
      B: "Khi i == j (5, 5), `continue` bỏ qua `steps++`."
      D: "Như A và B."

  - id: "M3-06"
    level: hard
    topic: "3.5"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      class Animal {
          Animal self() { return this; }
          static String type() { return "animal"; }
          String name() { return "a"; }
      }

      class Cat extends Animal {
          @Override Cat self() { return this; }
          static String type() { return "cat"; }
          @Override String name() { return "c" + super.name(); }
      }

      public class Covariant {
          public static void main(String[] args) {
              Animal a = new Cat();
              System.out.println(a.self().name() + " " + a.self().getClass().getSimpleName() + " "
                      + a.type() + " " + ((Cat) a).type());
          }
      }
    expect: "ca Cat animal cat"
    options: {A: "ca Cat animal cat", B: "ca Animal animal cat", C: "ca Cat cat cat", D: "a Cat animal cat"}
    answer: A
    why: >-
      `Cat.self()` override với kiểu trả về covariant; object vẫn là `Cat` → `name()` của Cat → `ca`, `getClass()` là `Cat`.
      Method static không đa hình: `a.type()` theo kiểu tham chiếu `Animal`, `((Cat) a).type()` theo kiểu `Cat`.
    wrong:
      B: "`getClass()` trả về lớp thật của object (`Cat`)."
      C: "Method static chọn theo kiểu biến (`Animal`)."
      D: "`name()` được override: `\"c\" + super.name()`."

  - id: "M3-07"
    level: medium
    topic: "4.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Nest {
          public static void main(String[] args) {
              StringBuilder sb = new StringBuilder();
              try {
                  try {
                      sb.append(1);
                      throw new Exception("e1");
                  } catch (Exception e) {
                      sb.append(2);
                      throw new RuntimeException("e2", e);
                  } finally {
                      sb.append(3);
                  }
              } catch (RuntimeException e) {
                  sb.append(4).append(e.getCause().getMessage());
              } finally {
                  sb.append(5);
              }
              System.out.println(sb);
          }
      }
    expect: "1234e15"
    options: {A: "12345e1", B: "124e15", C: "1234e25", D: "1234e15"}
    answer: D
    why: >-
      Khối trong: 1, catch 2 rồi ném exception mới (cause là `e1`), `finally` trong 3. Khối ngoài bắt: 4 + message của cause
      (`e1`), rồi `finally` ngoài 5.
    wrong:
      A: "`e1` được thêm trong catch ngoài, trước `finally` ngoài (5)."
      B: "`finally` trong vẫn chạy khi catch ném exception mới → có 3."
      C: "`getCause()` là exception gốc `e1`, không phải `e2`."

  - id: "M3-08"
    level: hard
    topic: "6.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.stream.*;

      public class Combiner {
          public static void main(String[] args) {
              int total = Stream.of("a", "bb", "ccc").reduce(0,
                      (acc, s) -> acc + s.length(),
                      (x, y) -> { System.out.print("combine "); return x + y; });
              System.out.println(total);
          }
      }
    expect: "6"
    opt_style: text
    options:
      A: "`combine combine 6`"
      B: "`6`"
      C: "`combine 6`"
      D: "Không biên dịch được: `reduce` không có dạng 3 tham số"
    answer: B
    why: >-
      Dạng `reduce(identity, accumulator, combiner)` cho phép kết quả khác kiểu phần tử. Với stream **tuần tự**, chỉ
      accumulator được dùng; combiner chỉ gộp kết quả từng phần khi chạy song song.
    wrong:
      A: "Stream tuần tự không chia nhỏ, nên không gọi combiner."
      C: "Như A — combiner không được gọi lần nào."
      D: "`Stream.reduce` có dạng 3 tham số `(U identity, BiFunction, BinaryOperator)`."

  - id: "M3-09"
    level: medium
    topic: "8.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;
      import java.util.concurrent.*;

      public class AnyOf {
          public static void main(String[] args) throws Exception {
              ExecutorService ex = Executors.newFixedThreadPool(3);
              List<Callable<String>> tasks = List.of(
                      () -> { throw new IllegalStateException(); },
                      () -> "ok",
                      () -> { throw new IllegalArgumentException(); });
              String r = ex.invokeAny(tasks);
              ex.shutdown();
              System.out.println(r + " " + ex.awaitTermination(1, TimeUnit.SECONDS));
          }
      }
    expect: "ok true"
    opt_style: text
    options:
      A: "Ném `ExecutionException`"
      B: "`null true`"
      C: "`ok true`"
      D: "`ok false`"
    answer: C
    why: >-
      `invokeAny` trả về kết quả của **một** task hoàn thành thành công (ở đây chỉ có `"ok"`). Nó chỉ ném
      `ExecutionException` khi **mọi** task đều thất bại. Sau `shutdown()`, không còn task → `awaitTermination` trả về `true`.
    wrong:
      A: "Có một task thành công nên không ném exception."
      B: "`invokeAny` trả về kết quả thật của task thành công."
      D: "Mọi task đã kết thúc, executor kết thúc trong thời gian chờ."

  - id: "M3-10"
    level: medium
    topic: "1.4"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.time.*;
      import java.time.temporal.ChronoUnit;

      public class NewYear {
          public static void main(String[] args) {
              LocalDateTime t = LocalDateTime.of(2024, 12, 31, 23, 59, 45);
              LocalDateTime u = t.plusSeconds(20).truncatedTo(ChronoUnit.MINUTES);
              System.out.println(u + " " + u.getDayOfWeek() + " " + u.getDayOfYear() + " " + t.toLocalDate().isLeapYear());
          }
      }
    expect: "2025-01-01T00:00 WEDNESDAY 1 true"
    options:
      A: "2025-01-01T00:00 WEDNESDAY 1 true"
      B: "2025-01-01T00:00:05 WEDNESDAY 1 true"
      C: "2024-12-31T23:59 TUESDAY 366 true"
      D: "2025-01-01T00:00 THURSDAY 1 false"
    answer: A
    why: >-
      23:59:45 + 20 giây = 2025-01-01 00:00:05; `truncatedTo(MINUTES)` bỏ giây → `2025-01-01T00:00` (giây 0 không được in).
      Ngày đó là thứ Tư, ngày thứ 1 của năm. Năm 2024 là năm nhuận.
    wrong:
      B: "`truncatedTo(MINUTES)` bỏ phần giây."
      C: "Cộng giây xảy ra **trước** khi cắt bớt."
      D: "1/1/2025 là thứ Tư; và 2024 chia hết cho 4 (năm nhuận)."

  - id: "M3-11"
    level: medium
    topic: "3.4"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Blocks {
          public static void main(String[] args) {
              int x = 1;
              { int y = 2; x += y; }
              for (int i = 0; i < 2; i++) { int z = i; }
              int y = 3;                                     // L1
              int z = 4;                                     // L2
              for (int x2 = 0, y2 = 1; x2 < 1; x2++) { }     // L3
              int i = x;                                     // L4
              { int x = 5; }                                 // L5
          }
      }
    error_markers: [L5]
    options: {A: L1 và L2, B: "L1, L2 và L5", C: L4 và L5, D: Chỉ L5, E: Không dòng nào}
    answer: D
    why: >-
      `y`, `z`, `i` trước đó chỉ sống trong khối/vòng lặp của chúng, nên khai báo lại sau đó là hợp lệ (L1, L2, L4). Nhưng
      `x` vẫn còn trong phạm vi khi vào khối ở L5 → không được khai báo biến cục bộ trùng tên.
    wrong:
      A: "Phạm vi của `y` và `z` đầu tiên đã kết thúc."
      B: "L1 và L2 hợp lệ."
      C: "`i` của vòng `for` đã hết phạm vi, nên L4 hợp lệ."
      E: "L5 khai báo lại `x` khi `x` còn trong phạm vi."

  - id: "M3-12"
    level: medium
    topic: "9.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.io.*;
      import java.util.*;

      public class Graph {
          static class Node implements Serializable {
              String n;
              Node next;
              Node(String n) { this.n = n; }
          }

          public static void main(String[] args) throws Exception {
              Node a = new Node("a"), b = new Node("b");
              a.next = b;
              b.next = a;
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              try (var out = new ObjectOutputStream(bytes)) { out.writeObject(new ArrayList<>(List.of(a, b))); }
              try (var in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                  @SuppressWarnings("unchecked")
                  List<Node> r = (List<Node>) in.readObject();
                  System.out.println((r.get(0).next == r.get(1)) + " " + (r.get(1).next == r.get(0)) + " " + (r.get(0) == a));
              }
          }
      }
    expect: "true true false"
    options: {A: "false false false", B: "true true false", C: "true true true", D: "StackOverflowError"}
    answer: B
    why: >-
      Serialization ghi mỗi object **một lần** trong cùng một stream và dùng tham chiếu cho các lần gặp sau, nên cấu trúc
      vòng được giữ nguyên và không bị lặp vô hạn. Object đọc ra là object **mới**, khác object gốc.
    wrong:
      A: "Quan hệ tham chiếu giữa các object trong cùng stream được khôi phục."
      C: "Deserialize tạo object mới, không trả về object gốc."
      D: "Serialization xử lý được vòng tham chiếu."

  - id: "M3-13"
    level: hard
    topic: "1.2"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      public class Ternary {
          public static void main(String[] args) {
              int a = 5;
              Object o1 = true ? a : "x";
              Object o2 = true ? 1 : 2.0;
              Object o3 = false ? 'A' : 66;
              System.out.println(o1.getClass().getSimpleName() + " " + o2 + " " + o3);
          }
      }
    expect: "Integer 1.0 B"
    options: {A: "Integer 1 B", B: "Integer 1.0 66", C: "Integer 1.0 B", D: "Object 1 66"}
    answer: C
    why: >-
      Kiểu của toán tử ba ngôi phụ thuộc **cả hai nhánh**: `int` và `String` → boxing thành `Integer`. `int` và `double` →
      nâng kiểu thành `double` (1.0). `char` và hằng số `int` vừa khoảng `char` → kiểu `char` → 66 thành `'B'`.
    wrong:
      A: "Nhánh còn lại là `double` nên 1 được nâng thành 1.0."
      B: "Khi một nhánh là `char` và nhánh kia là hằng số `int` vừa `char`, kết quả có kiểu `char`."
      D: "Object thật của `o1` là `Integer`; các nhánh số được nâng kiểu như trên."

  - id: "M3-14"
    level: hard
    topic: "5.1"
    q: Chương trình sau in ra gì?
    kind: output
    code: |
      import java.util.*;

      public class MutableKey {
          public static void main(String[] args) {
              List<String> key = new ArrayList<>(List.of("a"));
              Map<List<String>, Integer> m = new HashMap<>();
              m.put(key, 1);
              key.add("b");
              System.out.println(m.get(key) + " " + m.containsKey(List.of("a")) + " " + m.size());
          }
      }
    expect: "null false 1"
    options: {A: "null false 1", B: "1 false 1", C: "1 true 1", D: "null true 1"}
    answer: A
    why: >-
      `HashMap` lưu hash của key lúc `put`. Sửa key sau đó làm `hashCode()` đổi → `get(key)` tìm sai "ngăn" → `null`.
      `List.of("a")` có hash khớp hash cũ nhưng `equals` với key hiện tại (`[a, b]`) sai → `false`. Entry vẫn nằm trong map.
      Bài học: không dùng object mutable làm key.
    wrong:
      B: "Hash của key đã đổi, nên không tìm thấy entry cũ."
      C: "Key trong map giờ là `[a, b]`, không bằng `[a]`."
      D: "Hash khớp nhưng `equals` thất bại."

  - id: "M3-15"
    level: medium
    topic: "6.1"
    q: Đoạn code nào, chèn vào chỗ `// INSERT CODE HERE`, biên dịch và in ra `[A, B, C]`?
    kind: variants
    criterion: {output: "[A, B, C]"}
    template: |
      import java.util.*;
      import java.util.stream.*;

      public class Upper {
          public static void main(String[] args) {
              List<String> in = List.of("a,b", "c");
              /*INSERT*/
          }
      }
    options:
      A: "System.out.println(in.stream().flatMap(s -> Arrays.stream(s.split(\",\"))).map(String::toUpperCase).toList());"
      B: "System.out.println(in.stream().map(s -> s.split(\",\")).map(String::toUpperCase).toList());"
      C: "System.out.println(in.stream().<String>mapMulti((s, sink) -> { for (String p : s.split(\",\")) sink.accept(p.toUpperCase()); }).toList());"
      D: "System.out.println(String.join(\",\", in).toUpperCase().chars().filter(Character::isLetter).mapToObj(c -> String.valueOf((char) c)).toList());"
      E: "System.out.println(in.stream().map(String::toUpperCase).toList());"
    answer: [A, C, D]
    why: >-
      A: `flatMap` tách mỗi chuỗi thành nhiều phần tử. C: `mapMulti` (Java 16+) đẩy 0..n phần tử cho mỗi đầu vào.
      D: nối chuỗi, lấy các ký tự chữ.
    wrong:
      B: "`map(s -> s.split(\",\"))` tạo `Stream<String[]>`; mảng không có `toUpperCase` → lỗi biên dịch."
      E: "Không tách chuỗi: kết quả là `[A,B, C]` (2 phần tử)."

  - id: "M3-16"
    level: hard
    topic: "3.7"
    q: Những dòng nào gây lỗi biên dịch?
    kind: compile_error
    code: |
      public class Enums {
          enum Color { RED, GREEN; Color() { } }                                       // L1
          enum Size { S, M; public Size() { } }                                        // L2
          enum Level { LOW(1), HIGH(2); final int v; Level(int v) { this.v = v; } }    // L3
          enum Mode { ON { void f() { } }, OFF; abstract void f(); }                   // L4
          enum Pet { int legs; DOG, CAT; }                                             // L5

          public static void main(String[] args) { }
      }
    error_markers: [L2, L4, L5]
    options: {A: L2 và L5, B: "L2, L4 và L5", C: L4 và L5, D: "L1, L2 và L5", E: Chỉ L2}
    answer: B
    why: >-
      L2: constructor enum không được `public`. L4: enum có method abstract thì **mọi** hằng số phải cài đặt nó; `OFF`
      không có thân. L5: danh sách hằng số phải đứng **đầu** thân enum. L1 (constructor không modifier) và L3 hợp lệ.
    wrong:
      A: "L4 cũng lỗi: `OFF` không cài đặt method abstract `f()`."
      C: "L2 cũng lỗi: constructor enum chỉ có thể private (ngầm hoặc tường minh)."
      D: "L1 hợp lệ: constructor không modifier trong enum ngầm là private."
      E: "L4 và L5 cũng lỗi."

