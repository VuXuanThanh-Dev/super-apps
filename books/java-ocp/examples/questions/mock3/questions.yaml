      B: "`getOrDefault(k, d)` thêm key `k` với giá trị `d` vào map nếu chưa có."
      C: "`merge(k, v, f)` xoá key nếu hàm `f` trả về `null`."
      D: "`TreeMap.firstKey()` trên map rỗng trả về `null`."
      E: "`HashMap` cho phép nhiều key `null`."
    proofs:
      A:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new HashMap<>(); m.put("k", 1); System.out.println(m.put("k", 2)); } }
        expect: "1"
      B:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new HashMap<>(); m.getOrDefault("k", 0); System.out.println(m.size()); } }
        expect: "0"
      C:
        holds: true
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new HashMap<>(Map.of("k", 1));
              m.merge("k", 5, (x, y) -> null);
              System.out.println(m.containsKey("k")); } }
        expect: "false"
      D:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) { new TreeMap<String, Integer>().firstKey(); } }
        expect_exception: NoSuchElementException
      E:
        holds: false
        code: |
          import java.util.*;
          public class P { public static void main(String[] a) {
              Map<String, Integer> m = new HashMap<>(); m.put(null, 1); m.put(null, 2); System.out.println(m.size() + " " + m.get(null)); } }
        expect: "1 2"
    answer: [A, C]
    why: >-
      A: `put` trả về giá trị trước đó. C: hàm merge trả về `null` nghĩa là "xoá mapping".
    wrong:
