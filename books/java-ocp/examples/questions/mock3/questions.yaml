      D: "ok {false=[null, b], true=[a]}"
    answer: C
    why: >-
      `groupingBy` không cho phép **key** `null` → `NullPointerException` ("element cannot be mapped to a null key").
      Sau khi lọc `null`, `partitioningBy` chia thành `false=[b]` và `true=[a]`.
    wrong:
