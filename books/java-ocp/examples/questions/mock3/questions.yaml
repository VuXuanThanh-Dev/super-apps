              System.out.println(la.toLocalDateTime() + " " + la.getOffset() + " " + hcm.toInstant().equals(la.toInstant())
                      + " " + hcm.isEqual(la) + " " + hcm.equals(la));
          }
      }
    expect: "2024-05-31T11:00 -07:00 true true false"
    options:
      A: "2024-06-01T11:00 -07:00 true true true"
      B: "2024-05-31T11:00 -08:00 true true false"
      C: "2024-05-31T11:00 -07:00 true true false"
      D: "2024-05-31T11:00 -07:00 true false false"
    answer: C
    why: >-
      01:00 ngày 1/6 ở Việt Nam (UTC+7) = 18:00 UTC ngày 31/5. Tháng 6 Los Angeles dùng giờ mùa hè PDT (UTC-7) → 11:00 ngày
      31/5. Cùng một thời điểm: `isEqual` so sánh instant → `true`; `equals` so sánh cả múi giờ → `false`.
    wrong:
      A: "Đi về phía tây qua nhiều múi giờ làm lùi ngày; và `equals` so sánh cả zone."
      B: "Tháng 6 là giờ mùa hè ở Los Angeles: -07:00."
      D: "`isEqual` chỉ so sánh thời điểm (instant)."

