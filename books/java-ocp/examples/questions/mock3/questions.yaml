    q: >-
      Điền nội dung `module-info.java` nào cho module provider `com.p` (thay `// INSERT CODE HERE`) để consumer `com.app`
      (có `uses com.api.Svc`) tìm thấy ít nhất một provider (in ra `found`)?
    kind: script_variants
    criterion: {output: "found"}
    files:
      src/com.api/module-info.java: "module com.api { exports com.api; }"
      src/com.api/com/api/Svc.java: |
        package com.api;
        public interface Svc { String id(); }
      src/com.p/module-info.java: "/*INSERT*/"
      src/com.p/com/p/Impl.java: |
        package com.p;
        public class Impl implements com.api.Svc { public String id() { return "impl"; } }
      src/com.p/com/p/Impl2.java: |
        package com.p;
        public class Impl2 implements com.api.Svc { public String id() { return "impl2"; } }
      src/com.app/module-info.java: |
        module com.app { requires com.api; uses com.api.Svc; }
      src/com.app/com/app/Main.java: |
        package com.app;
        public class Main {
            public static void main(String[] args) {
                long n = java.util.ServiceLoader.load(com.api.Svc.class).stream().count();
                System.out.println(n > 0 ? "found" : "none");
            }
        }
    show:
      src/com.app/module-info.java: |
        module com.app { requires com.api; uses com.api.Svc; }
    run: |
      if javac -d out --module-source-path src -m com.api,com.p,com.app >/dev/null 2>&1; then
        java -p out -m com.app/com.app.Main 2>/dev/null
      else
        echo "compile error"
      fi
    options:
      A: "module com.p { requires com.api; provides com.api.Svc with com.p.Impl; }"
      B: "module com.p { requires com.api; provides com.api.Svc with com.p.Impl, com.p.Impl2; }"
      C: "module com.p { provides com.api.Svc with com.p.Impl; }"
      D: "module com.p { requires com.api; exports com.p; provides com.p.Impl with com.api.Svc; }"
      E: "module com.p { requires com.api; uses com.api.Svc; }"
    answer: [A, B]
    why: >-
      Provider cần đọc module chứa interface (`requires com.api`) và khai báo `provides Interface with Impl1[, Impl2...]`.
      Một directive `provides` có thể liệt kê nhiều lớp cài đặt (B).
    wrong:
      C: "Thiếu `requires com.api` → không nhìn thấy `com.api.Svc` → lỗi biên dịch."
      D: "Thứ tự bị đảo: phải là `provides <interface> with <cài đặt>`."
      E: "`uses` khai báo **dùng** service, không cung cấp provider → consumer không thấy gì (`none`)."

