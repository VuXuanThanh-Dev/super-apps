    q: >-
      Module `com.v` đã được đóng gói vào `mods/x.jar` (JAR modular). Lệnh nào (thay cho `<LỆNH>`) in ra dòng đầu tiên bắt đầu
      bằng tên module `com.v` (tức là hiển thị mô tả module)?
    kind: script_variants
    criterion: {output: "com.v"}
    placeholder: "<LỆNH>"
    files:
      src/com.v/module-info.java: "module com.v { exports com.v; }"
      src/com.v/com/v/V.java: |
        package com.v;
        public class V { }
    show: {}
    run: |
      javac -d out --module-source-path src -m com.v && mkdir -p mods && jar --create --file mods/x.jar -C out/com.v .
      /*INSERT*/ 2>/dev/null | head -1 | grep -v "not found" | cut -d' ' -f1
    options:
      A: "jar --describe-module --file mods/x.jar"
      B: "jar -d -f mods/x.jar"
      C: "java -p mods --describe-module com.v"
      D: "jar --list --file mods/x.jar"
      E: "java --describe-module com.v"
    answer: [A, B, C]
